<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CITY OS 2.0</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Orbitron:wght@400;700;900&display=swap');

:root {
  --bg: #08111e;
  --panel: #0e1a2a;
  --panel2: #152135;
  --border: #1e3050;
  --border2: #2a4060;
  --accent: #00d4ff;
  --accent2: #ff6b35;
  --green: #00ff88;
  --yellow: #ffd700;
  --red: #ff4444;
  --text: #d0e0f0;
  --text-dim: #4a6080;
  --text-mid: #8aa0c0;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── HEADER ── */
header {
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  padding: 6px 14px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
  z-index: 20;
}
.logo {
  font-family: 'Orbitron', monospace;
  font-weight: 900;
  font-size: 16px;
  color: var(--accent);
  letter-spacing: 3px;
  text-shadow: 0 0 20px rgba(0,212,255,0.6);
  white-space: nowrap;
}
.stats-bar {
  display: flex;
  gap: 6px;
  flex: 1;
  overflow-x: auto;
  scrollbar-width: none;
}
.stats-bar::-webkit-scrollbar { display: none; }

.stat-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 3px 8px;
  white-space: nowrap;
  min-width: 90px;
  transition: border-color 0.3s;
  position: relative;
  cursor: help;
}
.stat-chip.warning { border-color: var(--yellow); }
.stat-chip.danger  { border-color: var(--red); animation: pulse-border 1s infinite; }
@keyframes pulse-border {
  0%,100% { box-shadow: none; }
  50% { box-shadow: 0 0 6px var(--red); }
}
.stat-chip .icon { font-size: 14px; }
.stat-chip .slabel { font-size: 9px; color: var(--text-dim); }
.stat-chip .svalue { font-size: 12px; font-weight: 700; }
.stat-chip .sbar { width: 36px; height: 3px; background: #0a1a2a; border-radius: 2px; overflow: hidden; }
.stat-chip .sbar-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }

.header-right { display: flex; gap: 6px; margin-left: auto; align-items: center; }
.btn {
  padding: 5px 12px;
  border: 1px solid var(--border2);
  border-radius: 5px;
  background: var(--panel2);
  color: var(--text);
  cursor: pointer;
  font-size: 11px;
  font-family: 'Noto Sans KR', sans-serif;
  transition: all 0.15s;
  white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(0,212,255,0.05); }
.btn.primary { border-color: var(--accent); background: rgba(0,212,255,0.08); color: var(--accent); }
#loadInput { display: none; }

/* ── MAIN ── */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── LEFT PANEL ── */
.left-panel {
  width: 190px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
}
.left-scroll {
  overflow-y: auto;
  flex: 1;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.panel-section {
  border-bottom: 1px solid var(--border);
  padding: 7px;
}
.panel-title {
  font-size: 9px;
  font-weight: 700;
  color: var(--text-dim);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 5px;
  padding: 0 2px;
}
.building-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px;
}
.building-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 2px;
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 5px;
  cursor: pointer;
  transition: all 0.12s;
  font-size: 9px;
  color: var(--text-dim);
  text-align: center;
  line-height: 1.2;
}
.building-btn:hover { border-color: var(--accent); color: var(--text); background: rgba(0,212,255,0.05); }
.building-btn.selected { border-color: var(--accent); color: var(--accent); background: rgba(0,212,255,0.08); box-shadow: 0 0 6px rgba(0,212,255,0.15); }
.building-btn .thumb { width: 36px; height: 28px; }
.tool-btn {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 7px 4px; background: var(--panel2); border: 1px solid var(--border);
  border-radius: 5px; cursor: pointer; transition: all 0.12s;
  font-size: 9px; color: var(--text-dim); text-align: center;
}
.tool-btn:hover { border-color: var(--accent); color: var(--text); }
.tool-btn.selected { border-color: var(--accent2); color: var(--accent2); background: rgba(255,107,53,0.08); }
.tool-btn .bicon { font-size: 18px; }

/* ── MAP ── */
.map-area {
  flex: 1;
  overflow: auto;
  background: radial-gradient(ellipse at center, #0a1520 0%, #050b14 100%);
  position: relative;
  display: flex;
  align-items: flex-start;
  justify-content: flex-start;
  padding: 20px;
  cursor: crosshair;
}
#gameCanvas {
  display: block;
  image-rendering: pixelated;
  box-shadow: 0 0 40px rgba(0,100,200,0.3), 0 0 80px rgba(0,50,100,0.2);
}

/* ── RIGHT PANEL ── */
.right-panel {
  width: 185px;
  background: var(--panel);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.info-box { padding: 8px; border-bottom: 1px solid var(--border); }
.info-title { font-size: 9px; font-weight: 700; color: var(--text-dim); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 5px; }
.selected-card { background: var(--panel2); border-radius: 5px; padding: 7px; }
.selected-name { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 3px; }
.selected-cat { font-size: 10px; color: var(--text-dim); margin-bottom: 4px; }
.effect-row { display: flex; justify-content: space-between; font-size: 10px; padding: 1px 0; }
.plus { color: var(--green); } .minus { color: #f87171; }
.req-row { display: flex; justify-content: space-between; font-size: 10px; padding: 1px 0; color: var(--yellow); }
.alert-box { background: rgba(255,68,68,0.08); border: 1px solid rgba(255,68,68,0.3); border-radius: 5px; padding: 6px; margin-bottom: 4px; }
.alert-title { font-size: 9px; font-weight: 700; color: var(--red); margin-bottom: 3px; }
.alert-msg { font-size: 10px; color: #ff8888; line-height: 1.4; }
.city-stat-row { display: flex; justify-content: space-between; font-size: 10px; padding: 2px 0; border-bottom: 1px solid #0e1a2a; }

/* ── STATUS BAR ── */
.status-bar {
  background: var(--panel);
  border-top: 1px solid var(--border);
  padding: 3px 14px;
  font-size: 10px;
  color: var(--text-dim);
  display: flex;
  gap: 18px;
  flex-shrink: 0;
}

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>
<header>
  <div class="logo">CITY OS</div>
  <div class="stats-bar" id="statsBar"></div>
  <div class="header-right">
    <button class="btn" onclick="newCity()">🗺 새 도시</button>
    <button class="btn primary" onclick="saveCity()">💾 저장</button>
    <button class="btn" onclick="document.getElementById('loadInput').click()">📂 불러오기</button>
    <input type="file" id="loadInput" accept=".json" onchange="loadCity(event)">
  </div>
</header>

<div class="main">
  <div class="left-panel">
    <div class="left-scroll" id="leftScroll"></div>
  </div>

  <div class="map-area" id="mapArea">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div class="right-panel">
    <div class="info-box">
      <div class="info-title">선택 항목</div>
      <div id="selectedInfo" class="selected-card">
        <div class="selected-name">도로</div>
        <div class="selected-cat">기반 시설</div>
      </div>
    </div>
    <div class="info-box">
      <div class="info-title">효과</div>
      <div id="effectsInfo" style="font-size:10px">-</div>
    </div>
    <div class="info-box">
      <div class="info-title">⚠ 경고</div>
      <div id="alertsInfo" style="font-size:10px;color:var(--text-dim)">문제 없음</div>
    </div>
    <div class="info-box">
      <div class="info-title">타일 정보</div>
      <div id="tileInfo" style="font-size:10px;color:var(--text-dim)">마우스를 올려보세요</div>
    </div>
    <div class="info-box">
      <div class="info-title">도시 총계</div>
      <div id="cityStats" style="font-size:10px"></div>
    </div>
  </div>
</div>

<div class="status-bar">
  <span id="coordDisplay">좌표: -</span>
  <span id="buildingCount">건물: 0개</span>
  <span id="roadCount">도로: 0칸</span>
  <span>30×30 그리드 | R=도로 E=지우기 우클릭=지우기</span>
</div>

<script>
// ══════════════════════════════════════════
// SVG BUILDING DRAWERS
// Each returns a function(ctx, x, y, tw, th, active)
// ══════════════════════════════════════════
const D = {
  // ── GROUND / ROAD ──
  road(ctx, x, y, w, h) {
    ctx.fillStyle = '#1e1e2e'; ctx.fillRect(x,y,w,h);
    ctx.strokeStyle = '#3a3a5a'; ctx.lineWidth = 0.5;
    ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(x+w/2,y); ctx.lineTo(x+w/2,y+h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x,y+h/2); ctx.lineTo(x+w,y+h/2); ctx.stroke();
    ctx.setLineDash([]);
  },
  empty(ctx, x, y, w, h) {
    ctx.fillStyle = '#08111e'; ctx.fillRect(x,y,w,h);
    ctx.strokeStyle = '#0e1a2a'; ctx.lineWidth = 0.5;
    ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
  },

  // ── RESIDENTIAL ──
  house(ctx, x, y, w, h, a) {
    const c = a ? ['#4a7a5a','#3a6a4a','#8b6a4a','#a07a5a'] : ['#2a3a2a','#1a2a1a','#3a3030','#4a4040'];
    // base
    ctx.fillStyle = c[0]; ctx.fillRect(x+4,y+h/2,w-8,h/2-2);
    // door
    ctx.fillStyle = c[2]; ctx.fillRect(x+w/2-3,y+h*0.65,6,h*0.35-2);
    // window
    ctx.fillStyle = a ? '#ffffaa' : '#334455';
    ctx.fillRect(x+5,y+h*0.55,5,4); ctx.fillRect(x+w-10,y+h*0.55,5,4);
    // roof
    ctx.fillStyle = c[3]; ctx.beginPath();
    ctx.moveTo(x+2,y+h/2); ctx.lineTo(x+w/2,y+4); ctx.lineTo(x+w-2,y+h/2); ctx.closePath(); ctx.fill();
  },
  apartment(ctx, x, y, w, h, a) {
    const col = a ? '#2a5a8a' : '#1a2a3a';
    const wc  = a ? '#aaddff' : '#223344';
    ctx.fillStyle = col; ctx.fillRect(x+2,y+8,w-4,h-10);
    // windows grid
    for(let row=0;row<4;row++) for(let col2=0;col2<3;col2++) {
      ctx.fillStyle = (a && Math.random()>0.3) ? '#ffffaa' : wc;
      ctx.fillRect(x+4+col2*8, y+10+row*7, 5, 4);
    }
    // roof outline
    ctx.fillStyle = a ? '#3a6a9a' : '#223344'; ctx.fillRect(x+2,y+5,w-4,5);
    // antenna
    if(a){ ctx.strokeStyle='#5a8aaa';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x+w/2,y+5);ctx.lineTo(x+w/2,y+2);ctx.stroke(); }
  },
  villa(ctx, x, y, w, h, a) {
    const c = a ? ['#4a6a3a','#5a7a4a','#7a5a3a'] : ['#2a2a2a','#1a1a1a','#3a2a1a'];
    ctx.fillStyle = c[0]; ctx.fillRect(x+3,y+h/2-2,w-6,h/2);
    ctx.fillStyle = c[2]; ctx.beginPath();
    ctx.moveTo(x+2,y+h/2-2); ctx.lineTo(x+w/2,y+5); ctx.lineTo(x+w-2,y+h/2-2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = a?'#ffffaa':'#334455';
    ctx.fillRect(x+5,y+h*0.55,4,3); ctx.fillRect(x+w-9,y+h*0.55,4,3);
    ctx.fillStyle=c[2]; ctx.fillRect(x+w/2-2,y+h*0.7,4,h*0.3-2);
  },
  highrise(ctx, x, y, w, h, a) {
    const c = a ? '#1a4a7a' : '#0e2030';
    ctx.fillStyle = c; ctx.fillRect(x+3,y+3,w-6,h-5);
    ctx.strokeStyle = a ? '#2a6aaa' : '#1a2a3a'; ctx.lineWidth = 0.5;
    for(let r=0;r<8;r++) { ctx.beginPath(); ctx.moveTo(x+3,y+3+r*(h-8)/8); ctx.lineTo(x+w-3,y+3+r*(h-8)/8); ctx.stroke(); }
    // windows
    for(let r=0;r<7;r++) for(let cc=0;cc<4;cc++) {
      ctx.fillStyle = a ? (Math.random()>0.2?'#ffffaa':'#1a4a7a') : '#0e1a2a';
      ctx.fillRect(x+4+cc*5, y+4+r*5, 3, 3);
    }
    ctx.fillStyle = a?'#2a6aaa':'#0e1a2a'; ctx.fillRect(x+w/2-1,y,2,5);
  },
  mansion(ctx, x, y, w, h, a) {
    const c = a ? ['#6a4a2a','#8a6a3a','#4a3a2a'] : ['#2a1a0a','#3a2a1a','#1a1010'];
    ctx.fillStyle = c[0]; ctx.fillRect(x+2,y+h/2,w-4,h/2-2);
    ctx.fillStyle = c[1]; ctx.fillRect(x+2,y+h/2,w-4,4);
    // columns
    for(let i=0;i<4;i++) {ctx.fillStyle=a?'#c8a878':'#4a3a2a';ctx.fillRect(x+5+i*9,y+h/2-6,3,h/2+4);}
    // roof
    ctx.fillStyle=c[2]; ctx.beginPath();
    ctx.moveTo(x+2,y+h/2-6); ctx.lineTo(x+w/2,y+6); ctx.lineTo(x+w-2,y+h/2-6); ctx.closePath(); ctx.fill();
    ctx.fillStyle=a?'#ffffaa':'#334455';
    ctx.fillRect(x+7,y+h*0.65,5,5); ctx.fillRect(x+w-12,y+h*0.65,5,5);
  },
  dormitory(ctx, x, y, w, h, a) {
    const c = a ? '#3a5a7a' : '#1a2a3a';
    ctx.fillStyle=c; ctx.fillRect(x+2,y+10,w-4,h-12);
    ctx.fillStyle=a?'#4a6a8a':'#1e2e3e'; ctx.fillRect(x+2,y+7,w-4,5);
    for(let r=0;r<3;r++) for(let cc=0;cc<4;cc++) {
      ctx.fillStyle=a?(Math.random()>0.4?'#aaddff':'#3a5a7a'):'#0e1a2a';
      ctx.fillRect(x+4+cc*8,y+12+r*7,5,4);
    }
    ctx.fillStyle=a?'#ffffaa':'#334455'; ctx.fillRect(x+w/2-3,y+h-7,6,7);
  },

  // ── COMMERCIAL ──
  shop(ctx, x, y, w, h, a) {
    const c = a?'#7a5a2a':'#2a2010';
    ctx.fillStyle=c; ctx.fillRect(x+2,y+h/2,w-4,h/2-2);
    ctx.fillStyle=a?'#ffaa44':'#3a2a10'; ctx.fillRect(x+2,y+h/2-4,w-4,6);
    ctx.fillStyle=a?'rgba(200,230,255,0.8)':'#1a2a1a'; ctx.fillRect(x+3,y+h*0.55,w-6,h*0.3);
    ctx.fillStyle=a?'#ffdd88':'#3a3010'; ctx.fillRect(x+w/2-3,y+h*0.68,6,h*0.32-2);
    if(a){ctx.fillStyle='#ff4444';ctx.font=`bold ${Math.floor(h*0.18)}px sans-serif`;ctx.fillText('OPEN',x+4,y+h*0.52);}
  },
  mall(ctx, x, y, w, h, a) {
    ctx.fillStyle=a?'#5a4a8a':'#1a1a3a'; ctx.fillRect(x+1,y+8,w-2,h-10);
    ctx.fillStyle=a?'#8a6acc':'#2a1a4a'; ctx.fillRect(x+1,y+5,w-2,5);
    // entrance dome
    ctx.fillStyle=a?'rgba(180,200,255,0.5)':'rgba(50,70,100,0.5)';
    ctx.beginPath(); ctx.arc(x+w/2,y+h-8,8,Math.PI,0); ctx.fill();
    // windows
    for(let r=0;r<3;r++) for(let cc=0;cc<5;cc++) {
      ctx.fillStyle=a?'rgba(200,220,255,0.6)':'#1a1a3a';
      ctx.fillRect(x+3+cc*6,y+10+r*7,4,4);
    }
  },
  office(ctx, x, y, w, h, a) {
    ctx.fillStyle=a?'#2a4a6a':'#0e1a2a'; ctx.fillRect(x+3,y+4,w-6,h-6);
    // glass facade
    for(let r=0;r<6;r++) {
      ctx.fillStyle=a?(r%2===0?'rgba(100,180,255,0.4)':'rgba(50,120,200,0.3)'):'rgba(20,40,60,0.5)';
      ctx.fillRect(x+4,y+5+r*(h-10)/6,w-8,(h-10)/6-1);
    }
    ctx.fillStyle=a?'rgba(100,180,255,0.6)':'rgba(20,40,60,0.8)';
    ctx.fillRect(x+3,y+4,w-6,4);
    ctx.fillStyle=a?'#ffffaa':'#334455'; ctx.fillRect(x+w/2-3,y+h-6,6,6);
  },
  hotel(ctx, x, y, w, h, a) {
    ctx.fillStyle=a?'#5a3a6a':'#1a1025'; ctx.fillRect(x+2,y+5,w-4,h-7);
    ctx.fillStyle=a?'#7a4a8a':'#2a1a35'; ctx.fillRect(x+2,y+3,w-4,4);
    // H sign
    if(a){ctx.fillStyle='#ffdd00';ctx.font=`bold ${Math.floor(h*0.2)}px sans-serif`;ctx.fillText('H',x+w/2-4,y+10);}
    for(let r=0;r<5;r++) for(let cc=0;cc<3;cc++) {
      ctx.fillStyle=a?(Math.random()>0.3?'#ffeecc':'#5a3a6a'):'#0e0820';
      ctx.fillRect(x+4+cc*9,y+8+r*7,6,4);
    }
  },
  restaurant(ctx, x, y, w, h, a) {
    ctx.fillStyle=a?'#6a3a3a':'#2a1010'; ctx.fillRect(x+2,y+h/2,w-4,h/2-2);
    ctx.fillStyle=a?'#cc5544':'#3a1a1a'; ctx.fillRect(x+1,y+h/2-5,w-2,7);
    ctx.fillStyle=a?'rgba(200,230,255,0.7)':'#1a0a0a'; ctx.fillRect(x+3,y+h*0.55,w-6,h*0.25);
    if(a){ctx.fillStyle='#fff';ctx.font=`${Math.floor(h*0.15)}px sans-serif`;ctx.fillText('🍽',x+w/2-5,y+h*0.52);}
  },
  bank(ctx, x, y, w, h, a) {
    ctx.fillStyle=a?'#4a6a4a':'#1a2a1a'; ctx.fillRect(x+2,y+h/2,w-4,h/2-2);
    for(let i=0;i<4;i++){ctx.fillStyle=a?'#c8d8c8':'#2a3a2a';ctx.fillRect(x+4+i*9,y+h/2-8,4,h/2+6);}
    ctx.fillStyle=a?'#8aaa8a':'#2a3a2a'; ctx.beginPath();
    ctx.moveTo(x+1,y+h/2); ctx.lineTo(x+w/2,y+6); ctx.lineTo(x+w-1,y+h/2); ctx.closePath(); ctx.fill();
    ctx.fillStyle=a?'#ffffaa':'#334455'; ctx.fillRect(x+w/2-4,y+h*0.7,8,h*0.3-2);
  },
  convenience(ctx, x, y, w, h, a) {
    ctx.fillStyle=a?'#2a5a3a':'#0a1a10'; ctx.fillRect(x+2,y+h/2,w-4,h/2-2);
    ctx.fillStyle=a?'rgba(180,230,180,0.7)':'rgba(20,60,30,0.7)'; ctx.fillRect(x+3,y+h/2,w-6,h*0.3);
    ctx.fillStyle=a?'#44cc44':'#1a3a1a'; ctx.fillRect(x+1,y+h/2-4,w-2,6);
    if(a){ctx.fillStyle='#fff';ctx.font=`bold ${Math.floor(h*0.15)}px sans-serif`;ctx.fillText('24h',x+3,y+h*0.52);}
    ctx.fillStyle=a?'#ffffaa':'#334455'; ctx.fillRect(x+w/2-3,y+h*0.7,6,h*0.3-2);
  },
  cafe(ctx, x, y, w, h, a) {
    ctx.fillStyle=a?'#5a3a2a':'#1a1008'; ctx.fillRect(x+2,y+h/2,w-4,h/2-2);

  // ── INDUSTRIAL ──
  farm(ctx, x, y, w, h, a) {

  // ── CULTURE ──
  stadium(ctx, x, y, w, h, a) {

  museum(ctx, x, y, w, h, a) {

  park(ctx, x, y, w, h, a) {
    ctx.fillStyle=a?'#2a6a2a':'#0a1a0a'; ctx.fillRect(x,y,w,h);

    const tc=(r,c,s)=>{
      const cx=x+c,cy=y+r;

      ctx.fillStyle=a?'#2a8a2a':'#0a1a0a'; ctx.beginPath(); ctx.arc(cx,cy,s/2,0,Math.PI*2); ctx.fill();
    };
    tc(8,8,8); tc(8,w-8,8); tc(h-8,8,8); tc(h-8,w-8,8); tc(h/2,w/2,10);
    // path
    ctx.fillStyle=a?'#8a7a5a':'#2a2010'; ctx.fillRect(x+w/2-2,y,4,h);

  theater(ctx, x, y, w, h, a) {

  library(ctx, x, y, w, h, a) {

  solar(ctx, x, y, w, h, a) {

  windmill(ctx, x, y, w, h, a) {

  nuclear(ctx, x, y, w, h, a) {

  // ── WATER ──

  reservoir(ctx, x, y, w, h, a) {

      }
    }
    ctx.strokeStyle=a?'#4a8aaa':'#1a2a3a'; ctx.lineWidth=1; ctx.strokeRect(x+1,y+1,w-2,h-2);
  },

  // ── TRANSPORT ──
  busstop(ctx, x, y, w, h, a) {
    ctx.fillStyle=a?'#2a5a4a':'#0a1410'; ctx.fillRect(x+4,y+h*0.5,w-8,h*0.5-2);
    ctx.fillStyle=a?'#4a8a6a':'#0e1e14'; ctx.fillRect(x+3,y+h*0.47,w-6,4);
    ctx.strokeStyle=a?'#5a9a7a':'#0e1e14'; ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(x+5,y+h*0.5);ctx.lineTo(x+5,y+h-2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+w-5,y+h*0.5);ctx.lineTo(x+w-5,y+h-2);ctx.stroke();
    if(a){ctx.fillStyle='#aaffcc';ctx.font=`${Math.floor(h*0.2)}px sans-serif`;ctx.fillText('🚌',x+w/2-7,y+h*0.45);}
  },
  station(ctx, x, y, w, h, a) {
    ctx.fillStyle=a?'#2a3a6a':'#080e18'; ctx.fillRect(x+1,y+h*0.3,w-2,h*0.7-2);
    ctx.fillStyle=a?'#3a4a7a':'#0e1420'; ctx.fillRect(x+1,y+h*0.27,w-2,4);
    // arch windows
    for(let i=0;i<3;i++){
      ctx.fillStyle=a?'rgba(150,200,255,0.5)':'rgba(20,40,80,0.5)';
      ctx.beginPath();ctx.arc(x+8+i*12,y+h*0.45,5,Math.PI,0);ctx.lineTo(x+13+i*12,y+h*0.6);ctx.lineTo(x+3+i*12,y+h*0.6);ctx.closePath();ctx.fill();
    }
    // clock
    if(a){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+w/2,y+h*0.2,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#333';ctx.beginPath();ctx.arc(x+w/2,y+h*0.2,3,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle=a?'rgba(100,180,255,0.4)':'rgba(10,20,60,0.4)'; ctx.fillRect(x+3,y+h*0.65,w-6,6);
  },
  airport(ctx, x, y, w, h, a) {
    ctx.fillStyle=a?'#2a3a4a':'#080c10'; ctx.fillRect(x+1,y+h*0.5,w-2,h*0.5-2);
    ctx.fillStyle=a?'#3a4a5a':'#0e1418'; ctx.fillRect(x+1,y+h*0.47,w-2,4);
    // tower
    ctx.fillStyle=a?'#5a6a7a':'#1a1e22'; ctx.fillRect(x+w/2-3,y+h*0.15,6,h*0.35);
    ctx.fillStyle=a?'#6a7a8a':'#1e2226'; ctx.fillRect(x+w/2-5,y+h*0.13,10,5);
    // runway
    ctx.fillStyle=a?'#3a3a3a':'#0e0e0e'; ctx.fillRect(x+2,y+h*0.6,w-4,h*0.18);
    ctx.strokeStyle='#888';ctx.lineWidth=0.5;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(x+w/2,y+h*0.6);ctx.lineTo(x+w/2,y+h*0.78);ctx.stroke();
    ctx.setLineDash([]);
    if(a){ctx.font=`${Math.floor(h*0.25)}px sans-serif`;ctx.fillText('✈',x+4,y+h*0.48);}
  },
  parking(ctx, x, y, w, h, a) {
    ctx.fillStyle=a?'#2a2a3a':'#0a0a10'; ctx.fillRect(x+1,y+1,w-2,h-2);
    // parking lines
    for(let i=0;i<4;i++){
      ctx.fillStyle=a?'#1a1a2a':'#050508';
      ctx.fillRect(x+2+i*9,y+2,7,h-4);
      ctx.strokeStyle=a?'#5a5a6a':'#1a1a1e'; ctx.lineWidth=0.5;
      ctx.strokeRect(x+2+i*9,y+2,7,h-4);
    }
    if(a){ctx.fillStyle='#88aaff';ctx.font=`bold ${Math.floor(h*0.4)}px sans-serif`;ctx.textAlign='center';ctx.fillText('P',x+w/2,y+h*0.65);}
  },
  highway(ctx, x, y, w, h, a) {
    ctx.fillStyle=a?'#2a2a2a':'#0a0a0a'; ctx.fillRect(x,y,w,h);
    ctx.fillStyle=a?'#3a3a3a':'#121212'; ctx.fillRect(x,y+h/3,w,h/3);
    ctx.strokeStyle=a?'#ffff44':'#2a2a00'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(x,y+h/2);ctx.lineTo(x+w,y+h/2);ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle=a?'#ffffff':'#2a2a2a'; ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,y+h/3);ctx.lineTo(x+w,y+h/3);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x,y+h*2/3);ctx.lineTo(x+w,y+h*2/3);ctx.stroke();
  },
  helipad(ctx, x, y, w, h, a) {
    ctx.fillStyle=a?'#2a4a3a':'#0a1010'; ctx.fillRect(x+1,y+1,w-2,h-2);
    ctx.strokeStyle=a?'#4a8a6a':'#0e1e14'; ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(x+w/2,y+h/2,w/2-3,0,Math.PI*2);ctx.stroke();
    if(a){ctx.fillStyle='#00ff88';ctx.font=`bold ${Math.floor(h*0.45)}px sans-serif`;ctx.textAlign='center';ctx.fillText('H',x+w/2,y+h*0.68);}
  },

  // ── NATURE ──
  forest(ctx, x, y, w, h, a) {
    ctx.fillStyle=a?'#1a4a1a':'#061006'; ctx.fillRect(x,y,w,h);
    const t=(cx,cy,s,c)=>{
      ctx.fillStyle=a?'#2a1a0a':'#0a0604'; ctx.fillRect(cx-1,cy+s/3,2,s*0.7);
      ctx.fillStyle=c; ctx.beginPath();ctx.arc(cx,cy,s/2,0,Math.PI*2);ctx.fill();
    };
    t(x+7,y+9,12,a?'#2a6a2a':'#0a1a0a');
    t(x+w-8,y+11,10,a?'#3a7a3a':'#0e1e0e');
    t(x+w/2,y+7,14,a?'#225a22':'#081408');
    t(x+6,y+h-10,10,a?'#2a5a2a':'#0a1a0a');
    t(x+w-7,y+h-9,11,a?'#3a6a3a':'#0e1a0e');
  },
  river(ctx, x, y, w, h, a) {
    ctx.fillStyle=a?'#1a4a6a':'#080e14'; ctx.fillRect(x,y,w,h);
    ctx.fillStyle=a?'#2a6a9a':'#0a1a2a'; ctx.fillRect(x+3,y+2,w-6,h-4);
    if(a){
      for(let i=0;i<4;i++){
        ctx.fillStyle=`rgba(100,180,255,${0.15+i*0.05})`;
        ctx.beginPath();ctx.moveTo(x+3,y+4+i*4);ctx.bezierCurveTo(x+w/3,y+3+i*4,x+w*2/3,y+5+i*4,x+w-3,y+4+i*4);ctx.lineTo(x+w-3,y+7+i*4);ctx.bezierCurveTo(x+w*2/3,y+8+i*4,x+w/3,y+6+i*4,x+3,y+7+i*4);ctx.closePath();ctx.fill();
      }
    }
  },
  lake(ctx, x, y, w, h, a) {
    ctx.fillStyle=a?'#1a3a5a':'#080e14'; ctx.fillRect(x,y,w,h);
    ctx.fillStyle=a?'#2a5a8a':'#0a1828';
    ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,w/2-2,h/2-2,0,0,Math.PI*2);ctx.fill();
    if(a){
      ctx.fillStyle='rgba(100,180,255,0.3)';
      ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,w/3,h/3,0,0,Math.PI*2);ctx.fill();
    }
  },
  mountain(ctx, x, y, w, h, a) {
    ctx.fillStyle=a?'#3a3a3a':'#0e0e0e'; ctx.fillRect(x,y,w,h);
    ctx.fillStyle=a?'#5a5a4a':'#1a1a14';
    ctx.beginPath();ctx.moveTo(x+2,y+h-2);ctx.lineTo(x+w/2,y+4);ctx.lineTo(x+w-2,y+h-2);ctx.closePath();ctx.fill();
    ctx.fillStyle=a?'#8a8a7a':'#2a2a24';
    ctx.beginPath();ctx.moveTo(x+7,y+h-2);ctx.lineTo(x+w-4,y+h-2);ctx.lineTo(x+w*0.75,y+h*0.4);ctx.closePath();ctx.fill();
    // snow
    ctx.fillStyle=a?'#eeeeff':'#2a2a3a';
    ctx.beginPath();ctx.moveTo(x+w/2-5,y+h*0.2);ctx.lineTo(x+w/2,y+4);ctx.lineTo(x+w/2+5,y+h*0.2);ctx.closePath();ctx.fill();
  },
  beach(ctx, x, y, w, h, a) {
    ctx.fillStyle=a?'#e8d890':'#3a3020'; ctx.fillRect(x,y+h*0.5,w,h*0.5);
    ctx.fillStyle=a?'#2a6a9a':'#0a1828'; ctx.fillRect(x,y,w,h*0.52);
    if(a){
      ctx.fillStyle='rgba(100,180,255,0.3)';ctx.fillRect(x,y,w,h*0.5);
      // waves
      ctx.strokeStyle='rgba(200,240,255,0.5)';ctx.lineWidth=1;
      for(let i=0;i<3;i++){
        ctx.beginPath();ctx.moveTo(x,y+h*0.35+i*5);ctx.bezierCurveTo(x+w/3,y+h*0.33+i*5,x+w*2/3,y+h*0.37+i*5,x+w,y+h*0.35+i*5);ctx.stroke();
      }
    }
  },
  wetland(ctx, x, y, w, h, a) {
    ctx.fillStyle=a?'#2a4a2a':'#080e08'; ctx.fillRect(x,y,w,h);
    for(let i=0;i<6;i++){
      ctx.fillStyle=a?'#1a4a5a':'#080e10';
      ctx.beginPath();ctx.ellipse(x+4+i*6,y+h*0.7,3,3,0,0,Math.PI*2);ctx.fill();
    }
    // reeds
    ctx.strokeStyle=a?'#6a8a3a':'#1a2010';ctx.lineWidth=1;
    for(let i=0;i<5;i++){
      ctx.beginPath();ctx.moveTo(x+5+i*7,y+h);ctx.lineTo(x+4+i*7,y+h*0.3);ctx.stroke();
      ctx.fillStyle=a?'#8aaa4a':'#1a2a10';ctx.beginPath();ctx.ellipse(x+4+i*7,y+h*0.3,2,4,0,0,Math.PI*2);ctx.fill();
    }
  },
  glacier(ctx, x, y, w, h, a) {
    ctx.fillStyle=a?'#aaccee':'#2a3a4a'; ctx.fillRect(x,y,w,h);
    ctx.fillStyle=a?'#cceeff':'#3a4a5a';
    for(let i=0;i<4;i++) ctx.fillRect(x+i*9,y+i*4,9,h-i*4);
    if(a){
      ctx.fillStyle='rgba(200,240,255,0.4)'; ctx.fillRect(x,y,w,h);
      ctx.strokeStyle='rgba(150,200,240,0.6)';ctx.lineWidth=0.5;
      for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(x,y+i*10);ctx.lineTo(x+w,y+i*10+5);ctx.stroke();}
    }
  },
  volcano(ctx, x, y, w, h, a) {
    ctx.fillStyle=a?'#1a0a0a':'#080204'; ctx.fillRect(x,y,w,h);
    ctx.fillStyle=a?'#4a2a2a':'#140a0a';
    ctx.beginPath();ctx.moveTo(x+2,y+h-2);ctx.lineTo(x+w/2-4,y+h*0.25);ctx.lineTo(x+w/2+4,y+h*0.25);ctx.lineTo(x+w-2,y+h-2);ctx.closePath();ctx.fill();
    // lava
    if(a){
      ctx.fillStyle='rgba(255,80,0,0.7)';ctx.beginPath();ctx.arc(x+w/2,y+h*0.25,4,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,120,0,0.5)';
      ctx.beginPath();ctx.moveTo(x+w/2-4,y+h*0.25);ctx.bezierCurveTo(x+w/2-6,y+h*0.4,x+w/2-8,y+h*0.6,x+w/2-10,y+h-2);ctx.lineTo(x+w/2-4,y+h-2);ctx.closePath();ctx.fill();
    }
  },
  // ── SPECIAL ──
  hospital(ctx, x, y, w, h, a) {
    ctx.fillStyle=a?'#4a6a4a':'#101a10'; ctx.fillRect(x+2,y+h*0.35,w-4,h*0.65-2);
    ctx.fillStyle=a?'#6a8a6a':'#1a2a1a'; ctx.fillRect(x+2,y+h*0.32,w-4,4);
    for(let r=0;r<3;r++) for(let cc=0;cc<3;cc++){
      ctx.fillStyle=a?'rgba(200,230,200,0.5)':'rgba(40,60,40,0.5)';
      ctx.fillRect(x+5+cc*10,y+h*0.4+r*8,7,5);
    }
    if(a){
      ctx.fillStyle='#ff4444'; ctx.fillRect(x+w/2-5,y+h*0.18,10,3);
      ctx.fillRect(x+w/2-1.5,y+h*0.15,3,9);
    }
  },
  school(ctx, x, y, w, h, a) {
    ctx.fillStyle=a?'#6a5a3a':'#1a1408'; ctx.fillRect(x+2,y+h*0.4,w-4,h*0.6-2);
    ctx.fillStyle=a?'#8a7a5a':'#2a2010'; ctx.beginPath();
    ctx.moveTo(x+2,y+h*0.4); ctx.lineTo(x+w/2,y+h*0.18); ctx.lineTo(x+w-2,y+h*0.4); ctx.closePath(); ctx.fill();
    // bell
    if(a){ctx.strokeStyle='#ffdd00';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x+w/2,y+h*0.18);ctx.lineTo(x+w/2,y+h*0.1);ctx.stroke();}
    for(let r=0;r<2;r++) for(let cc=0;cc<3;cc++){
      ctx.fillStyle=a?'#ffffaa':'#334455'; ctx.fillRect(x+5+cc*10,y+h*0.5+r*9,7,5);
    }
    ctx.fillStyle=a?'#8a6a3a':'#2a1a08'; ctx.fillRect(x+w/2-3,y+h*0.7,6,h*0.3-2);
  },
  firestation(ctx, x, y, w, h, a) {
    ctx.fillStyle=a?'#6a2a2a':'#1a0808'; ctx.fillRect(x+2,y+h*0.35,w-4,h*0.65-2);
    ctx.fillStyle=a?'#aa3a3a':'#2a0e0e'; ctx.fillRect(x+2,y+h*0.32,w-4,4);
    // garage doors
    for(let i=0;i<2;i++){
      ctx.fillStyle=a?'#cc4a4a':'#2a0808'; ctx.fillRect(x+4+i*13,y+h*0.6,10,h*0.4-2);
      ctx.strokeStyle=a?'#ee6a6a':'#1a0808';ctx.lineWidth=0.5;
      for(let j=0;j<3;j++){ctx.beginPath();ctx.moveTo(x+4+i*13,y+h*0.6+j*5);ctx.lineTo(x+14+i*13,y+h*0.6+j*5);ctx.stroke();}
    }
  },
  policestation(ctx, x, y, w, h, a) {
    ctx.fillStyle=a?'#2a3a6a':'#080e18'; ctx.fillRect(x+2,y+h*0.35,w-4,h*0.65-2);
    ctx.fillStyle=a?'#3a4a7a':'#0e1420'; ctx.fillRect(x+2,y+h*0.32,w-4,4);
    if(a){ctx.fillStyle='#0044ff';ctx.fillRect(x+5,y+h*0.38,w-10,4);}
    for(let r=0;r<2;r++) for(let cc=0;cc<3;cc++){
      ctx.fillStyle=a?'rgba(150,180,255,0.5)':'rgba(20,40,80,0.5)';
      ctx.fillRect(x+5+cc*10,y+h*0.48+r*9,7,5);
    }
    ctx.fillStyle=a?'#ffffaa':'#334455'; ctx.fillRect(x+w/2-4,y+h*0.7,8,h*0.3-2);
  },
};

      { key:'firestation',   label:'소방서',       color:'#6a2a2a', effects:{job:6,pow:-4}, req:{pow:4} },
      { key:'policestation', label:'경찰서',       color:'#2a3a6a', effects:{job:6,pow:-4}, req:{pow:4} },

  {

      { key:'lake',        label:'호수',          color:'#1a3a5a', effects:{cul:10,wat:20} },

      { key:'glacier',     label:'빙하',          color:'#4a6a8a', effects:{cul:15,wat:30} },
      { key:'volcano',     label:'화산',          color:'#4a1a1a', effects:{cul:10,res:8} },

// Build lookup
const BUILDING_MAP = {};
CATEGORIES.forEach(cat => {
  if(cat.buildings) cat.buildings.forEach(b => {
    b.category = cat.key;
    b.catLabel = cat.label;
    BUILDING_MAP[b.key] = b;
  });
});

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
let grid = [];
let currentTool = 'road';
let isDragging = false;
let hoverCell = null;
let cityName = '새 도시';

function initGrid() {
  grid = [];
  for(let r=0;r<GRID_SIZE;r++){
    grid[r]=[];
    for(let c=0;c<GRID_SIZE;c++) grid[r][c]={type:'empty'};
  }
}

// ══════════════════════════════════════════
// STATS + CHAIN REACTIONS
// ══════════════════════════════════════════
function calcRawStats() {
  const s={pop:0,job:0,res:0,cul:0,pow:0,wat:0,trn:0};
  for(let r=0;r<GRID_SIZE;r++) for(let c=0;c<GRID_SIZE;c++) {
    const t=grid[r][c];
    if(t.type!=='empty'&&t.type!=='road') {
      const b=BUILDING_MAP[t.type];
      if(b) Object.entries(b.effects).forEach(([k,v])=>{ s[k]=(s[k]||0)+v; });
    }
  }
  return s;
}

// Check which buildings are "active" (have enough resources)
function calcActiveStatus(rawStats) {
  // First pass: gather supply buildings
  const active = {};
  // Mark all as active initially, then deactivate those missing requirements
  for(let r=0;r<GRID_SIZE;r++) for(let c=0;c<GRID_SIZE;c++) {
    const t=grid[r][c];
    if(t.type!=='empty'&&t.type!=='road') {
      const b=BUILDING_MAP[t.type];
      if(b&&b.req) {
        // check each requirement
        let ok=true;
        Object.entries(b.req).forEach(([k,v])=>{
          if((rawStats[k]||0)<v) ok=false;
        });
        active[`${r},${c}`]=ok;
      } else {
        active[`${r},${c}`]=true;
      }
    }
  }
  return active;
}

function calcFinalStats(activeMap) {
  const s={pop:0,job:0,res:0,cul:0,pow:0,wat:0,trn:0};
  for(let r=0;r<GRID_SIZE;r++) for(let c=0;c<GRID_SIZE;c++) {
    const t=grid[r][c];
    if(t.type!=='empty'&&t.type!=='road') {
      const b=BUILDING_MAP[t.type];
      if(b&&activeMap[`${r},${c}`]) {
        Object.entries(b.effects).forEach(([k,v])=>{ s[k]=(s[k]||0)+v; });
      }
    }
  }
  return s;
}

function getAlerts(stats) {
  const alerts=[];
  if(stats.pow<0) alerts.push({level:'danger',msg:`전기 부족! (${stats.pow}) → 발전소/태양광/풍력 필요`});
  if(stats.wat<0) alerts.push({level:'danger',msg:`수도 부족! (${stats.wat}) → 저수지/펌프장 필요`});
  if(stats.pop>0&&stats.job<0) alerts.push({level:'warning',msg:`일자리 부족! 상업/공업 시설 추가`});
  if(stats.trn<0) alerts.push({level:'warning',msg:`교통 혼잡! 역/버스 정류장 추가`});
  if(stats.res<0) alerts.push({level:'warning',msg:`자원 부족! 광산/농장 추가`});
  return alerts;
}

// ══════════════════════════════════════════
// CANVAS
// ══════════════════════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx2d = canvas.getContext('2d');
canvas.width = GRID_SIZE * TILE_SIZE;
canvas.height = GRID_SIZE * TILE_SIZE;

let currentActiveMap = {};

function drawAll() {
  const raw = calcRawStats();
  currentActiveMap = calcActiveStatus(raw);

  ctx2d.clearRect(0,0,canvas.width,canvas.height);

  for(let r=0;r<GRID_SIZE;r++) for(let c=0;c<GRID_SIZE;c++) {
    const x=c*TILE_SIZE, y=r*TILE_SIZE, w=TILE_SIZE, h=TILE_SIZE;
    const t=grid[r][c];
    const key=`${r},${c}`;
    const active=currentActiveMap[key]!==false;

    ctx2d.save();
    ctx2d.beginPath();
    ctx2d.rect(x,y,w,h);
    ctx2d.clip();

    if(t.type==='empty') {
      D.empty(ctx2d,x,y,w,h);
    } else if(t.type==='road') {
      D.road(ctx2d,x,y,w,h,true);
    } else {
      const drawer=D[t.type];
      if(drawer) drawer(ctx2d,x,y,w,h,active);
      else {
        ctx2d.fillStyle=active?'#334466':'#1a1a2a';
        ctx2d.fillRect(x,y,w,h);
      }
      if(!active) {
        ctx2d.fillStyle='rgba(0,0,0,0.55)';
        ctx2d.fillRect(x,y,w,h);
        ctx2d.fillStyle='rgba(255,60,60,0.7)';
        ctx2d.font=`bold ${Math.floor(h*0.4)}px sans-serif`;
        ctx2d.textAlign='center';
        ctx2d.textBaseline='middle';
        ctx2d.fillText('⚠',x+w/2,y+h/2);
      }
    }
    ctx2d.restore();

    // Grid line
    ctx2d.strokeStyle='rgba(20,40,70,0.4)';
    ctx2d.lineWidth=0.5;
    ctx2d.strokeRect(x+0.25,y+0.25,w-0.5,h-0.5);
  }

  // Hover
  if(hoverCell) {
    const {r,c}=hoverCell;
    ctx2d.fillStyle='rgba(0,212,255,0.12)';
    ctx2d.fillRect(c*TILE_SIZE,r*TILE_SIZE,TILE_SIZE,TILE_SIZE);
    ctx2d.strokeStyle='rgba(0,212,255,0.8)';
    ctx2d.lineWidth=1.5;
    ctx2d.strokeRect(c*TILE_SIZE+0.75,r*TILE_SIZE+0.75,TILE_SIZE-1.5,TILE_SIZE-1.5);
  }
}

// ══════════════════════════════════════════
// UI BUILDERS
// ══════════════════════════════════════════
function buildLeftPanel() {
  const scroller = document.getElementById('leftScroll');
  let html='';

  // Tools section
  html+=`<div class="panel-section"><div class="panel-title">🛠 도구</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:3px">`;
  html+=`<div class="tool-btn selected" id="tool-road" onclick="selectTool('road')"><div class="bicon">🛣</div><div>도로 (R)</div></div>`;
  html+=`<div class="tool-btn" id="tool-erase" onclick="selectTool('erase')"><div class="bicon">🗑</div><div>지우기 (E)</div></div>`;
  html+=`</div></div>`;

  // Building categories
  CATEGORIES.filter(c=>c.key!=='tool').forEach(cat=>{
    html+=`<div class="panel-section"><div class="panel-title">${cat.icon} ${cat.label}</div><div class="building-grid">`;
    cat.buildings.forEach(b=>{
      html+=`<div class="building-btn" id="bld-${b.key}" onclick="selectBuilding('${b.key}')" title="${b.label}">`;
      // Tiny SVG preview
      html+=`<svg class="thumb" viewBox="0 0 36 28" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="28" fill="#08111e"/><g transform="scale(1)">`;
      // Inline mini thumbnail — just color block with building shape hint
      html+=`<rect x="2" y="2" width="32" height="24" fill="${b.color}" rx="2" opacity="0.8"/>`;
      html+=`</g></svg>`;
      html+=`<span>${b.label}</span></div>`;
    });
    html+=`</div></div>`;
  });

  scroller.innerHTML=html;
}

function buildStatsBar() {
  const raw=calcRawStats();
  const activeMap=calcActiveStatus(raw);
  const stats=calcFinalStats(activeMap);
  const alerts=getAlerts(stats);

  const bar=document.getElementById('statsBar');
  bar.innerHTML='';
  STATS.forEach(s=>{
    const v=stats[s.key]||0;
    const pct=Math.max(0,Math.min(100,(v/300)*100));
    const hasAlert=alerts.some(a=>a.msg.includes(s.label));
    const cls=v<0?'danger':hasAlert?'warning':'';
    bar.innerHTML+=`<div class="stat-chip ${cls}" title="${s.label}: ${v}">
      <span class="icon">${s.icon}</span>
      <div><div class="slabel">${s.label}</div><div class="svalue" style="color:${v<0?'#ff4444':s.color}">${v}</div></div>
      <div class="sbar"><div class="sbar-fill" style="width:${pct}%;background:${v<0?'#ff4444':s.color}"></div></div>
    </div>`;
  });

  // Alerts
  const alertsDiv=document.getElementById('alertsInfo');
  if(alerts.length===0){
    alertsDiv.innerHTML=`<span style="color:var(--green)">✓ 문제 없음</span>`;
  } else {
    alertsDiv.innerHTML=alerts.map(a=>`<div class="alert-box"><div class="alert-title">${a.level==='danger'?'🔴 위험':'🟡 경고'}</div><div class="alert-msg">${a.msg}</div></div>`).join('');
  }

  // City stats
  const cityStatsDiv=document.getElementById('cityStats');
  cityStatsDiv.innerHTML=STATS.map(s=>{
    const v=stats[s.key]||0;
    const color=v<0?'#ff4444':v>0?s.color:'#4a6080';
    return `<div class="city-stat-row"><span>${s.icon} ${s.label}</span><span style="color:${color};font-weight:600">${v>0?'+':''}${v}</span></div>`;
  }).join('');

  // Counts
  let bCount=0,rCount=0;
  for(let r=0;r<GRID_SIZE;r++) for(let c=0;c<GRID_SIZE;c++){
    if(grid[r][c].type==='road') rCount++;
    else if(grid[r][c].type!=='empty') bCount++;
  }
  document.getElementById('buildingCount').textContent=`건물: ${bCount}개`;
  document.getElementById('roadCount').textContent=`도로: ${rCount}칸`;
}

function updateSelectedPanel() {
  let name,cat,effectsHtml='',reqHtml='';
  if(currentTool==='road'){
    name='도로'; cat='기반 시설';
    effectsHtml='<span style="color:var(--text-dim)">교통 연결</span>';
  } else if(currentTool==='erase'){
    name='지우기'; cat='도구';
    effectsHtml='<span style="color:var(--text-dim)">타일 제거</span>';
  } else {
    const b=BUILDING_MAP[currentTool];
    if(b){
      name=b.label; cat=b.catLabel||b.category;
      effectsHtml=Object.entries(b.effects).map(([k,v])=>{
        const s=STATS.find(s=>s.key===k);
        return `<div class="effect-row"><span>${s?s.icon+' '+s.label:k}</span><span class="${v>0?'plus':'minus'}">${v>0?'+':''}${v}</span></div>`;
      }).join('');
      if(b.req){
        reqHtml=`<div style="margin-top:6px;font-size:9px;color:var(--yellow);font-weight:700;margin-bottom:3px">필요 자원</div>`;
        reqHtml+=Object.entries(b.req).map(([k,v])=>{
          const s=STATS.find(s=>s.key===k);
          return `<div class="req-row"><span>${s?s.icon+' '+s.label:k}</span><span>≥ ${v}</span></div>`;
        }).join('');
      }
    }
  }
  document.getElementById('selectedInfo').innerHTML=`<div class="selected-name">${name}</div><div class="selected-cat">${cat}</div>`;
  document.getElementById('effectsInfo').innerHTML=effectsHtml+reqHtml||'-';
}

function selectTool(tool){
  currentTool=tool;
  document.querySelectorAll('.tool-btn,.building-btn').forEach(el=>el.classList.remove('selected'));
  const el=document.getElementById('tool-'+tool);
  if(el) el.classList.add('selected');
  updateSelectedPanel();
}

function selectBuilding(key){
  currentTool=key;
  document.querySelectorAll('.tool-btn,.building-btn').forEach(el=>el.classList.remove('selected'));
  const el=document.getElementById('bld-'+key);
  if(el) el.classList.add('selected');
  updateSelectedPanel();
}

// ══════════════════════════════════════════
// CANVAS EVENTS
// ══════════════════════════════════════════
function getCellFromEvent(e){
  const rect=canvas.getBoundingClientRect();
  const x=e.clientX-rect.left, y=e.clientY-rect.top;
  const c=Math.floor(x/TILE_SIZE), r=Math.floor(y/TILE_SIZE);
  if(r<0||r>=GRID_SIZE||c<0||c>=GRID_SIZE) return null;
  return {r,c};
}

function placeTile(r,c){
  if(currentTool==='erase') grid[r][c]={type:'empty'};
  else if(currentTool==='road') grid[r][c]={type:'road'};
  else if(BUILDING_MAP[currentTool]) grid[r][c]={type:currentTool};
}

function refresh(){
  drawAll();
  buildStatsBar();
}

canvas.addEventListener('mousedown',e=>{
  if(e.button!==0) return;
  isDragging=true;
  const cell=getCellFromEvent(e);
  if(cell){placeTile(cell.r,cell.c);refresh();}
});
canvas.addEventListener('mousemove',e=>{
  const cell=getCellFromEvent(e);
  hoverCell=cell;
  if(cell){
    document.getElementById('coordDisplay').textContent=`좌표: (${cell.c+1},${cell.r+1})`;
    const t=grid[cell.r][cell.c];
    let info=t.type==='empty'?'빈 땅':t.type==='road'?'도로':(BUILDING_MAP[t.type]?BUILDING_MAP[t.type].label:'?');
    const active=currentActiveMap[`${cell.r},${cell.c}`];
    if(active===false) info+=' ⚠ 비활성 (자원 부족)';
    document.getElementById('tileInfo').textContent=`(${cell.c+1},${cell.r+1}): ${info}`;
    if(isDragging){placeTile(cell.r,cell.c);refresh();}
    else drawAll();
  }
});
canvas.addEventListener('mouseup',()=>{isDragging=false;});
canvas.addEventListener('mouseleave',()=>{hoverCell=null;drawAll();});
canvas.addEventListener('contextmenu',e=>{
  e.preventDefault();
  const cell=getCellFromEvent(e);
  if(cell){grid[cell.r][cell.c]={type:'empty'};refresh();}
});

// ══════════════════════════════════════════
// SAVE / LOAD
// ══════════════════════════════════════════
function saveCity(){
  const name=prompt('도시 이름:',cityName)||cityName;
  cityName=name;
  const raw=calcRawStats();
  const activeMap=calcActiveStatus(raw);
  const stats=calcFinalStats(activeMap);
  const data={version:2,name,grid,stats};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${name}.json`;a.click();
}
function loadCity(e){
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      cityName=data.name||'불러온 도시';
      grid=data.grid;
      refresh();
      alert(`"${cityName}" 도시를 불러왔습니다!`);
    }catch{alert('파일을 읽을 수 없습니다.');}
  };
  r.readAsText(file);
  e.target.value='';
}
function newCity(){
  if(confirm('새 도시를 시작할까요? 현재 진행이 삭제됩니다.')){
    initGrid();refresh();
  }
}

// ══════════════════════════════════════════
// KEYBOARD
// ══════════════════════════════════════════
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='r'||e.key==='R') selectTool('road');
  if(e.key==='e'||e.key==='E'||e.key==='Escape') selectTool('erase');
});

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
initGrid();
buildLeftPanel();
buildStatsBar();
updateSelectedPanel();
drawAll();
</script>
