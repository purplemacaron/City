<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>CITY OS 4</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Russo+One&display=swap');

:root {
  --bg:#0f1923; --panel:#151f2e; --panel2:#1b2840; --panel3:#223050;
  --border:#1e3248; --border2:#2a4468;
  --accent:#00c8f0; --accent2:#ff7340; --green:#00e87a;
  --yellow:#ffca28; --red:#ff3d3d; --purple:#c084fc;
  --text:#cde0f5; --text2:#7a9cbf; --dim:#304560;
  --shadow:rgba(0,0,0,0.6);
  --tile:32px;
}
:root.light {
  --bg:#d8e8f4; --panel:#eaf2fa; --panel2:#ddeaf5; --panel3:#cfe0ef;
  --border:#aac4dc; --border2:#88aacc;
  --accent:#007aaa; --accent2:#cc4400; --green:#006633;
  --yellow:#aa6600; --red:#bb1111; --purple:#7733bb;
  --text:#0a1e32; --text2:#2a4a6a; --dim:#88aac0;
  --shadow:rgba(0,0,0,0.18);
}

*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;}

/* ── HEADER ── */
header{
  background:var(--panel);border-bottom:2px solid var(--border);
  padding:5px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0;
  box-shadow:0 2px 16px var(--shadow);position:relative;z-index:40;
}
.logo{font-family:'Russo One',sans-serif;font-size:17px;color:var(--accent);letter-spacing:1px;white-space:nowrap;}
.stats-scroll{display:flex;gap:5px;flex:1;overflow-x:auto;scrollbar-width:none;}
.stats-scroll::-webkit-scrollbar{display:none;}

.sc{
  display:flex;align-items:center;gap:4px;
  background:var(--panel2);border:1px solid var(--border);border-radius:6px;
  padding:3px 7px;white-space:nowrap;transition:border-color .2s;cursor:default;min-width:78px;
}
.sc.warn{border-color:var(--yellow);} .sc.dang{border-color:var(--red);animation:dp 1.2s infinite;}
@keyframes dp{0%,100%{box-shadow:none}50%{box-shadow:0 0 8px var(--red)}}
.sc .si{font-size:12px;} .sc .sl{font-size:8px;color:var(--dim);line-height:1;} .sc .sv{font-size:11px;font-weight:700;}
.sc .sbar{width:28px;height:3px;background:var(--panel3);border-radius:2px;margin-top:1px;}
.sc .sf{height:100%;border-radius:2px;transition:width .4s;}

/* Budget chip */
.budget-chip{
  display:flex;align-items:center;gap:6px;background:var(--panel2);
  border:1px solid var(--yellow);border-radius:6px;padding:4px 10px;white-space:nowrap;
}
.budget-chip .bl{font-size:8px;color:var(--dim);}
.budget-chip .bv{font-size:13px;font-weight:700;color:var(--yellow);font-family:'Russo One',sans-serif;}

/* City value */
.value-chip{
  display:flex;align-items:center;gap:6px;background:var(--panel2);
  border:1px solid var(--purple);border-radius:6px;padding:4px 10px;white-space:nowrap;
}
.value-chip .vl{font-size:8px;color:var(--dim);}
.value-chip .vv{font-size:13px;font-weight:700;color:var(--purple);font-family:'Russo One',sans-serif;}

.hbtns{display:flex;gap:5px;margin-left:auto;align-items:center;}
.btn{padding:4px 10px;border:1px solid var(--border2);border-radius:5px;background:var(--panel2);color:var(--text);cursor:pointer;font-size:11px;font-family:'Noto Sans KR',sans-serif;transition:all .14s;white-space:nowrap;}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn.pri{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);}
.btn.thm{font-size:14px;padding:3px 8px;}
#loadInput{display:none;}

/* ── MAIN ── */
.main{display:flex;flex:1;overflow:hidden;}

/* ── LEFT PANEL ── */
.lp{width:190px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
.lscroll{overflow-y:auto;flex:1;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.psec{border-bottom:1px solid var(--border);padding:6px;}
.ptit{font-size:8px;font-weight:700;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px;}

/* Mode tabs */
.mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-bottom:5px;}
.mtab{padding:5px;background:var(--panel2);border:1px solid var(--border);border-radius:5px;cursor:pointer;font-size:9px;color:var(--text2);text-align:center;transition:all .12s;}
.mtab:hover{border-color:var(--accent);}
.mtab.sel{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent);}
.mtab.tsel{border-color:var(--accent2);color:var(--accent2);background:color-mix(in srgb,var(--accent2) 6%,transparent);}

.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:3px;}
.bbt{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:5px 2px;background:var(--panel2);border:1px solid var(--border);
  border-radius:5px;cursor:pointer;transition:all .12s;font-size:8px;color:var(--text2);text-align:center;
  position:relative;overflow:hidden;
}
.bbt:hover{border-color:var(--accent);color:var(--text);}
.bbt.sel{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent);}
.bbt .bicon{font-size:22px;line-height:1;display:block;}
.bbt .bcost{
  position:absolute;top:2px;right:3px;font-size:7px;color:var(--yellow);
  font-weight:700;font-family:'Russo One',sans-serif;
}
.bbt .bsize{position:absolute;top:2px;left:3px;font-size:7px;color:var(--purple);}
.bbt.no-money{opacity:.45;pointer-events:none;}

/* terrain buttons */
.tbt{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;background:var(--panel2);border:1px solid var(--border);
  border-radius:5px;cursor:pointer;transition:all .12s;font-size:8px;color:var(--text2);text-align:center;
}
.tbt:hover{border-color:var(--accent2);}
.tbt.sel{border-color:var(--accent2);color:var(--accent2);background:color-mix(in srgb,var(--accent2) 7%,transparent);}
.tbt .ticon{font-size:22px;}
.toolbtn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:6px 4px;background:var(--panel2);border:1px solid var(--border);
  border-radius:5px;cursor:pointer;font-size:9px;color:var(--text2);text-align:center;transition:all .12s;
}
.toolbtn:hover{border-color:var(--accent);color:var(--text);}
.toolbtn.sel{border-color:var(--accent2);color:var(--accent2);background:color-mix(in srgb,var(--accent2) 7%,transparent);}
.toolbtn .ti2{font-size:16px;}

/* ── MAP ── */
.map-wrap{flex:1;overflow:auto;background:var(--bg);position:relative;cursor:crosshair;user-select:none;}
#mapCanvas{display:block;image-rendering:crisp-edges;}

/* ── RIGHT PANEL ── */
.rp{width:185px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.rbox{padding:8px;border-bottom:1px solid var(--border);}
.rtit{font-size:8px;font-weight:700;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px;}

.sel-card{background:var(--panel2);border-radius:6px;padding:7px;}
.sel-icon{font-size:28px;margin-bottom:3px;}
.sel-name{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:1px;}
.sel-cat{font-size:9px;color:var(--text2);}
.eff-row{display:flex;justify-content:space-between;font-size:10px;padding:1.5px 0;}
.ep{color:var(--green);} .en{color:#f87171;}
.req-row{display:flex;justify-content:space-between;font-size:10px;padding:1.5px 0;color:var(--yellow);}
.alert-c{background:color-mix(in srgb,var(--red) 10%,transparent);border:1px solid color-mix(in srgb,var(--red) 35%,transparent);border-radius:5px;padding:5px;margin-bottom:4px;}
.warn-c{background:color-mix(in srgb,var(--yellow) 8%,transparent);border:1px solid color-mix(in srgb,var(--yellow) 35%,transparent);border-radius:5px;padding:5px;margin-bottom:4px;}
.at{font-size:8px;font-weight:700;margin-bottom:2px;} .am{font-size:10px;line-height:1.4;}
.srow{display:flex;justify-content:space-between;font-size:10px;padding:2px 0;border-bottom:1px solid var(--border);}
.tile-info{background:var(--panel2);border-radius:6px;padding:7px;font-size:10px;color:var(--text2);line-height:1.7;}
.ti-name{font-size:12px;font-weight:700;color:var(--text);margin-bottom:3px;}
.inactive-reason{color:var(--red);font-size:9px;margin-top:3px;line-height:1.5;}

/* cost indicator popup */
.cost-popup{
  position:fixed;background:var(--panel);border:1px solid var(--yellow);border-radius:5px;
  padding:3px 8px;font-size:11px;font-weight:700;color:var(--yellow);
  pointer-events:none;z-index:1000;display:none;font-family:'Russo One',sans-serif;
  transform:translate(-50%,-130%);
}

/* ── STATUS BAR ── */
.statusbar{background:var(--panel);border-top:1px solid var(--border);padding:3px 12px;font-size:10px;color:var(--dim);display:flex;gap:16px;flex-shrink:0;}

/* TERRAIN EDITOR MODAL */
.terrain-modal{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;
  align-items:center;justify-content:center;
}
.terrain-modal.open{display:flex;}
.terrain-box{background:var(--panel);border:1px solid var(--border2);border-radius:12px;padding:20px;max-width:500px;width:90%;}
.terrain-box h2{font-family:'Russo One',sans-serif;font-size:18px;color:var(--accent);margin-bottom:12px;}
.terrain-presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.preset-btn{padding:10px 4px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;cursor:pointer;text-align:center;font-size:9px;color:var(--text2);transition:all .14s;}
.preset-btn:hover{border-color:var(--accent);color:var(--accent);}
.preset-btn .picon{font-size:24px;display:block;margin-bottom:3px;}
.terrain-desc{font-size:11px;color:var(--text2);margin-bottom:12px;}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;}

::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
</style>
</head>
<body>

<header>
  <div class="logo">CITY OS</div>
  <div class="stats-scroll" id="statsRow"></div>
  <div class="budget-chip" title="인구 × 세율">
    <div><div class="bl">💰 예산</div><div class="bv" id="budgetVal">₩50,000</div></div>
    <div style="font-size:9px;color:var(--dim)" id="taxInfo">+₩0/턴</div>
  </div>
  <div class="value-chip" title="도시 종합 가치">
    <div><div class="vl">🏆 도시 가치</div><div class="vv" id="cityValueVal">0</div></div>
  </div>
  <div class="hbtns">
    <button class="btn thm" id="thmBtn" onclick="toggleTheme()" title="T">🌙</button>
    <button class="btn" onclick="openTerrainModal()">🗺 지형 편집</button>
    <button class="btn" onclick="newCity()">+ 새 도시</button>
    <button class="btn pri" onclick="saveCity()">💾 저장</button>
    <button class="btn" onclick="document.getElementById('loadInput').click()">📂 불러오기</button>
    <input type="file" id="loadInput" accept=".json" onchange="loadCity(event)">
  </div>
</header>

<div class="main">
  <!-- LEFT -->
  <div class="lp">
    <div class="lscroll" id="lscroll"></div>
  </div>

  <!-- MAP -->
  <div class="map-wrap" id="mapWrap">
    <canvas id="mapCanvas"></canvas>
  </div>

  <!-- RIGHT -->
  <div class="rp">
    <div class="rbox"><div class="rtit">선택 항목</div><div id="selCard" class="sel-card"><div class="sel-icon">🛣</div><div class="sel-name">도로</div><div class="sel-cat">기반 시설</div></div></div>
    <div class="rbox"><div class="rtit">효과 / 필요 조건</div><div id="effPanel" style="font-size:10px">-</div></div>
    <div class="rbox"><div class="rtit">⚠ 시스템 경고</div><div id="alertPanel" style="font-size:10px;color:var(--dim)">문제 없음</div></div>
    <div class="rbox"><div class="rtit">타일 정보</div><div id="tilePanel" class="tile-info">마우스를 올려보세요</div></div>
    <div class="rbox"><div class="rtit">도시 총계</div><div id="cityStats"></div></div>
  </div>
</div>

<div class="statusbar">
  <span id="coordD">좌표: -</span>
  <span id="bldCnt">건물: 0개</span>
  <span id="rdCnt">도로: 0칸</span>
  <span>R=도로 E=지우기 T=테마 우클릭=지우기</span>
</div>

<div class="cost-popup" id="costPopup">-₩0</div>
<div id="taxToast" style="position:fixed;top:56px;left:50%;transform:translate(-50%,-12px);background:var(--panel);border:1px solid var(--green);border-radius:8px;padding:6px 16px;font-size:13px;font-weight:700;color:var(--green);font-family:'Russo One',sans-serif;z-index:999;opacity:0;transition:opacity .4s,transform .4s;pointer-events:none;box-shadow:0 4px 20px rgba(0,232,122,0.25);">💰 세금 징수</div>

<!-- TERRAIN MODAL -->
<div class="terrain-modal" id="terrainModal">
  <div class="terrain-box">
    <h2>🗺 지형 편집</h2>
    <div class="terrain-desc">도시의 초기 지형을 선택하세요. 기존 건물은 삭제됩니다.</div>
    <div class="terrain-presets" id="presetGrid"></div>
    <div class="modal-btns">
      <button class="btn" onclick="closeTerrainModal()">취소</button>
    </div>
  </div>
</div>

<script>
'use strict';

// ══════════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════════
const GS = 30;       // grid size
const TS = 36;       // tile size px
const STARTING_BUDGET = 50000;
const TAX_PER_POP = 40;  // ₩ per population point per tax cycle

// Terrain types → render info
const TERRAIN = {
  grass:  { label:'초원', icon:'🌿', color:'#2d5a1b', color2:'#3a7022', colorL:'#6a9940', colorL2:'#7ab350' },
  water:  { label:'물',   icon:'💧', color:'#1a3d6e', color2:'#1e4a80', colorL:'#3a7aaa', colorL2:'#4a90bb' },
  sand:   { label:'모래', icon:'🏖', color:'#8a7a3a', color2:'#9a8a48', colorL:'#c8b460', colorL2:'#d4c070' },
  rock:   { label:'바위', icon:'🪨', color:'#4a4a3a', color2:'#585845', colorL:'#8a8a7a', colorL2:'#9a9a88' },
  snow:   { label:'눈',   icon:'❄', color:'#8090a8', color2:'#8ea0b8', colorL:'#c8d8e8', colorL2:'#d8e8f4' },
  forest: { label:'숲',   icon:'🌲', color:'#1a4a1a', color2:'#204e20', colorL:'#3a6a3a', colorL2:'#4a7a4a' },
  lava:   { label:'용암', icon:'🌋', color:'#5a1a0a', color2:'#681e0e', colorL:'#9a3a1a', colorL2:'#aa4a28' },
};

// Terrain presets (30×30 generation functions)
const TERRAIN_PRESETS = [
  { label:'기본 평원', icon:'🌿', desc:'모두 초원', gen:()=>plainGen('grass') },
  { label:'섬',        icon:'🏝', desc:'물 위의 섬', gen:()=>islandGen() },
  { label:'강이 있는 평원', icon:'🏞', desc:'강이 흐르는 초원', gen:()=>riverGen() },
  { label:'산악 지형', icon:'⛰', desc:'바위와 눈', gen:()=>mountainGen() },
  { label:'사막',      icon:'🏜', desc:'모래 사막', gen:()=>desertGen() },
  { label:'화산 지형', icon:'🌋', desc:'용암과 바위', gen:()=>volcanoGen() },
  { label:'북극',      icon:'🧊', desc:'눈과 얼음', gen:()=>arcticGen() },
  { label:'숲 지형',   icon:'🌲', desc:'짙은 숲', gen:()=>forestGen() },
];

// ══════════════════════════════════════════════════
// BUILDING DATA
// Stats → effects per building
// size: [rows, cols] — tiles it occupies
// cost: ₩ to build
// ══════════════════════════════════════════════════
const STATS_DEF = [
  {key:'pop', label:'인구',   icon:'👥', color:'#00e87a'},
  {key:'job', label:'일자리', icon:'💼', color:'#4db8ff'},
  {key:'res', label:'자원',   icon:'⚙',  color:'#ff7340'},
  {key:'cul', label:'문화',   icon:'🎭', color:'#c084fc'},
  {key:'pow', label:'전기',   icon:'⚡', color:'#ffca28'},
  {key:'wat', label:'수도',   icon:'💧', color:'#38bdf8'},
  {key:'trn', label:'교통',   icon:'🚌', color:'#00e87a'},
];

// buildable terrain: which terrain types allow building
const BUILDABLE = new Set(['grass','sand','rock','snow','forest','lava']);

const CATEGORIES = [
  {key:'infra', label:'기반 시설', icon:'🛣', terrain:true, buildings:[
    {key:'road',      label:'도로',         icon:'🛣', size:[1,1], cost:200,   effects:{trn:2}},
    {key:'highway',   label:'고속도로',     icon:'🛤', size:[1,2], cost:800,   effects:{trn:10}},
    {key:'bridge',    label:'다리',         icon:'🌉', size:[1,2], cost:1500,  effects:{trn:8},  allowWater:true},
    {key:'tunnel',    label:'터널',         icon:'🕳', size:[1,2], cost:3000,  effects:{trn:12}},
    {key:'roundabout',label:'로터리',       icon:'🔄', size:[2,2], cost:2000,  effects:{trn:20}},
    {key:'overpass',  label:'고가도로',     icon:'🌁', size:[1,3], cost:5000,  effects:{trn:18}},
  ]},
  {key:'residential', label:'주거', icon:'🏠', buildings:[
    {key:'house',       label:'단독주택',   icon:'🏠', size:[1,1], cost:2000,  effects:{pop:5,  pow:-2,  wat:-2}},
    {key:'villa',       label:'빌라',       icon:'🏘', size:[1,1], cost:3500,  effects:{pop:10, pow:-4,  wat:-4}},
    {key:'apartment',   label:'아파트',     icon:'🏢', size:[1,1], cost:8000,  effects:{pop:25, pow:-10, wat:-10}},
    {key:'highrise',    label:'초고층',     icon:'🏙', size:[2,2], cost:35000, effects:{pop:80, pow:-30, wat:-25}},
    {key:'mansion',     label:'고급주택',   icon:'🏰', size:[2,2], cost:20000, effects:{pop:15, cul:8,   pow:-8,  wat:-6}},
    {key:'dormitory',   label:'기숙사',     icon:'🏩', size:[1,1], cost:4000,  effects:{pop:18, pow:-6,  wat:-6}},
    {key:'cottage',     label:'전원주택',   icon:'🛖', size:[1,1], cost:2500,  effects:{pop:6,  cul:3,   pow:-2,  wat:-2}},
    {key:'penthouse',   label:'펜트하우스', icon:'🌆', size:[1,1], cost:18000, effects:{pop:8,  cul:10,  pow:-6,  wat:-4}},
    {key:'resort',      label:'리조트',     icon:'🏖', size:[2,2], cost:30000, effects:{pop:12, cul:20,  pow:-12, wat:-10}},
    {key:'commune',     label:'공동주택',   icon:'🏚', size:[1,1], cost:1500,  effects:{pop:12, pow:-4,  wat:-4}},
    {key:'shelter',     label:'임시 주거',  icon:'⛺', size:[1,1], cost:500,   effects:{pop:4,  pow:-1,  wat:-1}},
  ]},
  {key:'commercial', label:'상업', icon:'🏪', buildings:[
    {key:'shop',        label:'상점',       icon:'🏪', size:[1,1], cost:3000,  effects:{job:5,  cul:2,  pow:-3}},
    {key:'restaurant',  label:'레스토랑',   icon:'🍽', size:[1,1], cost:4000,  effects:{job:6,  cul:4,  pow:-3}},
    {key:'cafe',        label:'카페',       icon:'☕', size:[1,1], cost:2500,  effects:{job:3,  cul:3,  pow:-2}},
    {key:'mall',        label:'쇼핑몰',     icon:'🛍', size:[2,2], cost:28000, effects:{job:30, cul:15, pow:-18, trn:-8}},
    {key:'office',      label:'오피스',     icon:'🏦', size:[1,2], cost:15000, effects:{job:20, pow:-10}},
    {key:'hotel',       label:'호텔',       icon:'🏨', size:[2,2], cost:25000, effects:{job:15, cul:8,  pow:-10, wat:-8}},

// TERRAIN GENERATORS
// ══════════════════════════════════════════════════
function newTerrainGrid(fill='grass'){
  const g=[];
  for(let r=0;r<GS;r++){g[r]=[];for(let c=0;c<GS;c++)g[r][c]=fill;}
  return g;
}
function plainGen(t='grass'){ return newTerrainGrid(t); }
function islandGen(){
  const g=newTerrainGrid('water');
  const cx=GS/2,cy=GS/2,rad=GS*0.35;
  for(let r=0;r<GS;r++) for(let c=0;c<GS;c++){
    const d=Math.sqrt((r-cy)**2+(c-cx)**2)+noise2(r,c)*3;
    if(d<rad*0.6) g[r][c]='grass';
    else if(d<rad*0.75) g[r][c]='sand';
    else if(d<rad) g[r][c]='sand';
  }
  return g;
}
function riverGen(){
  const g=newTerrainGrid('grass');
  let rc=Math.floor(GS/2);
  for(let c=0;c<GS;c++){
    rc=Math.max(2,Math.min(GS-3,rc+Math.floor(Math.random()*3)-1));
    for(let w=0;w<2;w++) if(rc+w<GS) g[rc+w][c]='water';
    for(let w=-1;w<=2;w++) if(rc+w>=0&&rc+w<GS&&g[rc+w][c]!=='water') g[rc+w][c]='sand';
  }
  return g;
}
function mountainGen(){
  const g=newTerrainGrid('grass');
  const cx=GS/2,cy=GS/2,rad=GS*0.45;
  for(let r=0;r<GS;r++) for(let c=0;c<GS;c++){
    const d=Math.sqrt((r-cy)**2+(c-cx)**2)+noise2(r,c)*4;
    if(d<rad*0.3) g[r][c]='snow';
    else if(d<rad*0.55) g[r][c]='rock';
  }
  return g;
}
function desertGen(){
  const g=newTerrainGrid('sand');
  for(let r=0;r<GS;r++) for(let c=0;c<GS;c++){
    if(Math.random()<0.03) g[r][c]='rock';
  }
  return g;
}
function volcanoGen(){
  const g=newTerrainGrid('rock');
  const cx=GS/2,cy=GS/2;
  for(let r=0;r<GS;r++) for(let c=0;c<GS;c++){
    const d=Math.sqrt((r-cy)**2+(c-cx)**2);
    if(d<5) g[r][c]='lava';
    else if(d<8) g[r][c]='lava';
    else if(noise2(r,c)>0.4&&d>10) g[r][c]='lava';
  }
  return g;
}
function arcticGen(){
  const g=newTerrainGrid('snow');
  for(let r=0;r<GS;r++) for(let c=0;c<GS;c++){
    if(Math.random()<0.08) g[r][c]='rock';
    if(Math.random()<0.04) g[r][c]='water';
  }
  return g;
}
function forestGen(){
  const g=newTerrainGrid('forest');
  for(let r=0;r<GS;r++) for(let c=0;c<GS;c++){
    if(Math.random()<0.05) g[r][c]='rock';
    if(Math.random()<0.02) g[r][c]='water';
    if(Math.random()<0.1) g[r][c]='grass';
  }
  return g;
}
function noise2(r,c){ return Math.sin(r*0.7+c*0.5)*0.5+0.5; }

}

// STATS ENGINE
// ══════════════════════════════════════════════════
function calcRaw(){
  const s={pop:0,job:0,res:0,cul:0,pow:0,wat:0,trn:0};
  const seen=new Set();
  for(let r=0;r<GS;r++) for(let c=0;c<GS;c++){
    const t=grid[r][c];
    if(t.type==='empty'||t.type==='road') continue;
    const key=`${t.origin[0]},${t.origin[1]}`;
    if(seen.has(key)) continue; seen.add(key);
    const b=BMAP[t.type];
    if(b) Object.entries(b.effects).forEach(([k,v])=>s[k]=(s[k]||0)+v);
  }
  return s;
}

function buildActiveMaps(raw){
  const am={}, rm={};
  const seen=new Set();
  for(let r=0;r<GS;r++) for(let c=0;c<GS;c++){
    const t=grid[r][c];
    if(t.type==='empty'||t.type==='road') continue;
    const okey=`${t.origin[0]},${t.origin[1]}`;
    if(seen.has(okey)) continue; seen.add(okey);
    const b=BMAP[t.type];
    if(!b||!b.req){am[okey]=true;continue;}
    const reasons=[];
    Object.entries(b.req).forEach(([k,v])=>{
      if((raw[k]||0)<v){
        const sd=STATS_DEF.find(s=>s.key===k);
        reasons.push(`${sd?sd.icon+' '+sd.label:k} 부족 (현재 ${raw[k]||0}, 필요 ${v})`);
      }
    });
    if(reasons.length===0) am[okey]=true;
    else{am[okey]=false; rm[okey]=reasons.join('\n');}
  }
  return {am,rm};
}

function calcFinal(am){
  const s={pop:0,job:0,res:0,cul:0,pow:0,wat:0,trn:0};
  const seen=new Set();
  for(let r=0;r<GS;r++) for(let c=0;c<GS;c++){
    const t=grid[r][c];
    if(t.type==='empty'||t.type==='road') continue;
    const okey=`${t.origin[0]},${t.origin[1]}`;
    if(seen.has(okey)||!am[okey]) continue; seen.add(okey);
    const b=BMAP[t.type];
    if(b) Object.entries(b.effects).forEach(([k,v])=>s[k]=(s[k]||0)+v);
  }
  return s;
}

function calcCityValue(stats){
  // Weighted formula
  const w={pop:1.5, job:1.2, res:0.8, cul:2.0, pow:1.0, wat:1.0, trn:1.0};
  let v=0;
  Object.entries(w).forEach(([k,wt])=>{ v+=Math.max(0,(stats[k]||0))*wt; });
  // Penalties for negatives
  Object.keys(w).forEach(k=>{ if(stats[k]<0) v+=stats[k]*2; });
  return Math.max(0,Math.round(v));
}

function getAlerts(s){
  const a=[];
  if(s.pow<0) a.push({lvl:'d',msg:`⚡ 전기 부족 (${s.pow}) — 발전소 추가`});
  if(s.wat<0) a.push({lvl:'d',msg:`💧 수도 부족 (${s.wat}) — 저수지/탱크 추가`});
  if(s.res<0) a.push({lvl:'d',msg:`⚙ 자원 부족 (${s.res}) — 광산/농장 추가`});
  if(s.job<0) a.push({lvl:'w',msg:`💼 일자리 부족 (${s.job})`});
  if(s.trn<0) a.push({lvl:'w',msg:`🚌 교통 혼잡 (${s.trn})`});
  if(budget<0) a.push({lvl:'d',msg:`💰 예산 부족! 건물을 지을 수 없습니다`});
  return a;
}

// Tax income per "round"
function calcTaxIncome(stats){
  return Math.max(0,Math.floor((stats.pop||0)*TAX_PER_POP));
}

// ══════════════════════════════════════════════════
// MULTI-TILE BUILDING PLACEMENT
// ══════════════════════════════════════════════════
function canPlace(r, c, bdata){
  if(!bdata) return false;
  const [rows,cols]=bdata.size;
  for(let dr=0;dr<rows;dr++) for(let dc=0;dc<cols;dc++){
    const nr=r+dr, nc=c+dc;
    if(nr<0||nr>=GS||nc<0||nc>=GS) return false;
    // existing building?
    if(grid[nr][nc].type!=='empty') return false;
    // terrain allowed?
    const terr=terrain[nr][nc];
    if(bdata.allowWater && terr==='water') continue;
    if(!BUILDABLE.has(terr)) return false;
  }
  return true;
}

function placeBuilding(r, c, key){
  const b=BMAP[key];
  if(!b) return false;
  if(!canPlace(r,c,b)) return false;
  if(budget<b.cost) return false;
  const [rows,cols]=b.size;
  for(let dr=0;dr<rows;dr++) for(let dc=0;dc<cols;dc++){
    grid[r+dr][c+dc]={type:key, origin:[r,c]};
  }
  budget-=b.cost;
  return true;
}

function placeRoad(r, c){
  const b=BMAP[currentTool];
  if(!b) return false;
  const terr=terrain[r][c];
  if(!BUILDABLE.has(terr)&&!(b.allowWater&&terr==='water')) return false;
  const [rows,cols]=b.size;
  // for roads allow overwrite empty
  for(let dr=0;dr<rows;dr++) for(let dc=0;dc<cols;dc++){
    const nr=r+dr,nc=c+dc;
    if(nr>=GS||nc>=GS) return false;
    if(grid[nr][nc].type!=='empty'&&grid[nr][nc].type!==currentTool) return false;
  }
  if(budget<b.cost) return false;
  for(let dr=0;dr<rows;dr++) for(let dc=0;dc<cols;dc++){
    grid[r+dr][c+dc]={type:currentTool, origin:[r,c]};
  }
  budget-=b.cost;
  return true;
}

function eraseTile(r, c){
  const t=grid[r][c];
  if(t.type==='empty') return;
  const b=BMAP[t.type];
  if(b){
    // remove all tiles of this building
    const [or,oc]=t.origin;
    const [rows,cols]=b.size;
    for(let dr=0;dr<rows;dr++) for(let dc=0;dc<cols;dc++){
      if(grid[or+dr]&&grid[or+dr][oc+dc]&&grid[or+dr][oc+dc].type===t.type){
        grid[or+dr][oc+dc]={type:'empty'};
      }
    }
    // Refund 50%
    budget+=Math.floor(b.cost*0.5);
  } else {
    grid[r][c]={type:'empty'};
  }
}

const SPRITES = {};

// Helpers
function r255(v){return Math.round(v);}
function rgb(r,g,b){return `rgb(${r255(r)},${r255(g)},${r255(b)})`;}
function rect(c,x,y,w,h,col,alpha=1){c.globalAlpha=alpha;c.fillStyle=col;c.fillRect(x,y,w,h);}
function circ(c,x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();}
function win(c,x,y,w,h,lit=true){
  c.fillStyle=lit?'#ffe88a':'#223344';c.fillRect(x,y,w,h);
  c.strokeStyle='rgba(0,0,0,0.4)';c.lineWidth=0.5;c.strokeRect(x,y,w,h);
}
function roof(c,x,y,w,col){c.fillStyle=col;c.beginPath();c.moveTo(x,y);c.lineTo(x+w/2,-y*0+y-6);c.lineTo(x+w,y);c.closePath();c.fill();}
function windows(c,x,y,cols,rows,cw,ch,gap,lit=true){
  for(let r=0;r<rows;r++)for(let cc=0;cc<cols;cc++){
    win(c,x+cc*(cw+gap),y+r*(ch+gap),cw,ch,lit);
  }
}
function door(c,x,y,w,h,col='#5a3010'){c.fillStyle=col;c.fillRect(x,y,w,h);c.fillStyle='rgba(0,0,0,0.3)';c.fillRect(x+w*0.35,y+h*0.55,w*0.3,h*0.45);}
function chimney(c,x,y,w,h,col='#555'){c.fillStyle=col;c.fillRect(x,y,w,h);c.fillStyle='rgba(0,0,0,0.4)';c.fillRect(x,y,w,3);}

  c.strokeStyle='#ff8800';c.lineWidth=4;c.beginPath();c.moveTo(x+w-10,y+5);c.quadraticCurveTo(x+w-5,y+h*0.4,x+w-15,y+h*0.5);c.stroke();

  circ(c,x+w/2,y+h*0.42,h*0.34,'transparent');
  c.strokeStyle='#cc4400';c.lineWidth=2;c.beginPath();c.arc(x+w/2,y+h*0.42,h*0.34,0,Math.PI*2);c.stroke();
  for(let a=0;a<8;a++){const ang=a*Math.PI/4;c.strokeStyle='#cc4400';c.lineWidth=1;c.beginPath();c.moveTo(x+w/2,y+h*0.42);c.lineTo(x+w/2+Math.cos(ang)*h*0.34,y+h*0.42+Math.sin(ang)*h*0.34);c.stroke();}

  c.strokeStyle='#4488ff';c.lineWidth=3;c.beginPath();c.moveTo(x+4,y+h*0.8);c.lineTo(x+w*0.3,y+h*0.8);c.quadraticCurveTo(x+w*0.3,y+h*0.5,x+w*0.4,y+h*0.5);c.stroke();
};

  for(let r=0;r<3;r++)for(let cc=0;cc<4;cc++){

SPRITES.windmill=(c,x,y,w,h)=>{

  // blades
  c.fillStyle='#c0c8d0';
  for(let a=0;a<3;a++){c.save();c.translate(x+w/2,y+h*0.28);c.rotate(a*Math.PI*2/3);c.fillRect(-2,-h*0.28,4,h*0.28);c.restore();}
  circ(c,x+w/2,y+h*0.28,4,'#808898');

SPRITES.nuclear=(c,x,y,w,h)=>{
  rect(c,x+3,y+5,w-6,h-7,'#607060');
  // cooling towers (iconic)
  for(let i=0;i<2;i++){
    const tx=x+5+i*(w-10)/1.5;
    c.fillStyle='#808878';
    c.beginPath();c.moveTo(tx,y+h*0.75);c.quadraticCurveTo(tx+w*0.18,y+h*0.3,tx+w*0.2,y+h*0.2);c.quadraticCurveTo(tx+w*0.22,y+h*0.3,tx+w*0.35,y+h*0.75);c.closePath();c.fill();
  }
  // radiation symbol
  circ(c,x+w/2,y+h*0.55,8,'#ffcc00');
  c.strokeStyle='#1a1a1a';c.lineWidth=2;
  for(let a=0;a<3;a++){c.beginPath();c.moveTo(x+w/2,y+h*0.55);c.arc(x+w/2,y+h*0.55,7,a*Math.PI*2/3+0.3,(a+1)*Math.PI*2/3-0.3);c.fill();}
};

  chimney(c,x+w*0.6,y+h*0.15,8,h*0.24,'#909888');
  c.globalAlpha=0.4;circ(c,x+w*0.2,y+h*0.07,6,'#88eecc');circ(c,x+w*0.64,y+h*0.1,5,'#88eecc');c.globalAlpha=1;
  // lava glow

SPRITES.nat_geyser=(c,x,y,w,h)=>{
  circ(c,x+w/2,y+h*0.75,10,'#907060');
  // water jet
  c.strokeStyle='#88ccee';c.lineWidth=3;c.beginPath();c.moveTo(x+w/2,y+h*0.7);c.lineTo(x+w/2-3,y+h*0.3);c.stroke();
  c.lineWidth=2;c.beginPath();c.moveTo(x+w/2,y+h*0.7);c.lineTo(x+w/2+2,y+h*0.4);c.stroke();
  c.globalAlpha=0.4;circ(c,x+w/2-2,y+h*0.25,8,'#88ccee');c.globalAlpha=1;
};

// Fallback sprite (colored box with letter)
function fallbackSprite(key){
  return (c,x,y,w,h)=>{
    const cols=['#3a6aaa','#6aaa3a','#aa6a3a','#aa3a6a','#6a3aaa','#3aaa6a'];
    const col=cols[key.length%cols.length];
    rect(c,x+2,y+2,w-4,h-4,col);
    c.fillStyle='#ffffff88';c.font=`bold ${Math.min(w,h)*0.35}px sans-serif`;c.textAlign='center';c.textBaseline='middle';
    c.fillText(key.slice(0,2).toUpperCase(),x+w/2,y+h/2);
  };
}

// Pre-render sprite to offscreen canvas for perf
const SPRITE_CACHE = {};
function getSprite(key, w, h){
  const ck=`${key}_${w}_${h}`;
  if(SPRITE_CACHE[ck]) return SPRITE_CACHE[ck];
  const oc=document.createElement('canvas');
  oc.width=w;oc.height=h;
  const ox=oc.getContext('2d');
  const fn=SPRITES[key]||fallbackSprite(key);
  fn(ox,0,0,w,h);
  SPRITE_CACHE[ck]=oc;
  return oc;
}

// Invalidate sprite cache on theme change
function clearSpriteCache(){ for(const k in SPRITE_CACHE) delete SPRITE_CACHE[k]; }

// ══════════════════════════════════════════════════
// TERRAIN & GENERAL RENDERING
// ══════════════════════════════════════════════════
function getTerrainColor(type){
  const t=TERRAIN[type]||TERRAIN.grass;
  return isLight ? [t.colorL, t.colorL2] : [t.color, t.color2];
}

function drawTerrain(r,c){
  const x=c*TS, y=r*TS;
  const type=terrain[r][c];
  const [c1,c2]=getTerrainColor(type);
  ctx.fillStyle=(r+c)%2===0?c1:c2;
  ctx.fillRect(x,y,TS,TS);
  if(type==='water'){
    ctx.globalAlpha=0.25;ctx.fillStyle='#6ab8ff';
    const rnd=((r*31+c*17)%7);
    ctx.beginPath();ctx.arc(x+8+rnd,y+14,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x+22+rnd%3,y+22,2,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  } else if(type==='grass'){
    ctx.globalAlpha=0.15;ctx.fillStyle='#55aa22';
    if((r*7+c*11)%5===0){ctx.beginPath();ctx.arc(x+10,y+10,2,0,Math.PI*2);ctx.fill();}
    if((r*11+c*7)%5===0){ctx.beginPath();ctx.arc(x+24,y+24,2,0,Math.PI*2);ctx.fill();}
    ctx.globalAlpha=1;
  }
  ctx.strokeStyle=isLight?'rgba(0,0,0,0.06)':'rgba(255,255,255,0.04)';
  ctx.lineWidth=0.5;ctx.strokeRect(x,y,TS,TS);
}

// ══════════════════════════════════════════════════
// BUILDING DRAWING — sprite fills full multi-tile area
// ══════════════════════════════════════════════════
function drawBuilding(r,c,bdata,isActive){
  const x=c*TS, y=r*TS;
  const [rows,cols]=bdata.size;
  const w=cols*TS, h=rows*TS;

  // drop shadow
  ctx.shadowColor='rgba(0,0,0,0.45)';ctx.shadowBlur=7;ctx.shadowOffsetX=2;ctx.shadowOffsetY=3;
  ctx.fillStyle='transparent';ctx.fillRect(x+2,y+2,w-4,h-4);
  ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;

  if(isActive){
    const sp=getSprite(bdata.key, w, h);
    ctx.drawImage(sp,x,y,w,h);
  } else {
    // draw dimmed sprite
    ctx.globalAlpha=0.35;
    const sp=getSprite(bdata.key, w, h);
    ctx.drawImage(sp,x,y,w,h);
    ctx.globalAlpha=1;
    // red tint
    ctx.fillStyle='rgba(180,0,0,0.22)';ctx.fillRect(x,y,w,h);
    // ⚠ badge
    ctx.fillStyle='#ff3333';ctx.font='bold 11px sans-serif';ctx.textAlign='right';ctx.textBaseline='top';
    ctx.fillText('⚠',x+w-2,y+2);
  }

  // outer border
  ctx.strokeStyle=isActive?'rgba(255,255,255,0.12)':'rgba(255,50,50,0.5)';
  ctx.lineWidth=1;ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
}

// ══════════════════════════════════════════════════
// ROAD DRAWING — road fills each individual tile
// ══════════════════════════════════════════════════
function drawRoadTile(r,c,type){
  const x=c*TS, y=r*TS;
  const isRoad=type==='road'||type==='highway'||type==='bridge';
  const roadCol=isLight?'#7888a0':'#1c2438';
  const edgeCol=isLight?'#9aabbb':'#283550';
  ctx.fillStyle=roadCol;
  ctx.fillRect(x,y,TS,TS);
  // sidewalk edges
  ctx.fillStyle=edgeCol;
  ctx.fillRect(x,y,TS,2);ctx.fillRect(x,y+TS-2,TS,2);
  ctx.fillRect(x,y,2,TS);ctx.fillRect(x+TS-2,y,2,TS);
  // dashes
  ctx.strokeStyle=isLight?'rgba(255,255,255,0.4)':'rgba(255,210,50,0.45)';
  ctx.lineWidth=1;ctx.setLineDash([5,6]);
  ctx.beginPath();ctx.moveTo(x+TS/2,y+3);ctx.lineTo(x+TS/2,y+TS-3);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+3,y+TS/2);ctx.lineTo(x+TS-3,y+TS/2);ctx.stroke();
  ctx.setLineDash([]);
  if(type==='bridge'){
    // bridge rails
    ctx.fillStyle='#a09080';
    ctx.fillRect(x,y,TS,3);ctx.fillRect(x,y+TS-3,TS,3);
  }
}

function drawHover(r,c){
  const x=c*TS,y=r*TS;
  const b=BMAP[currentTool];
  if(currentMode==='build'&&b&&b.size){
    const [rows,cols]=b.size;
    const canP=canPlace(r,c,b)&&budget>=b.cost;
    ctx.fillStyle=canP?'rgba(0,220,120,0.15)':'rgba(255,60,60,0.15)';
    ctx.strokeStyle=canP?'rgba(0,220,120,0.85)':'rgba(255,60,60,0.85)';
    ctx.lineWidth=1.5;
    ctx.fillRect(x,y,cols*TS,rows*TS);ctx.strokeRect(x+0.75,y+0.75,cols*TS-1.5,rows*TS-1.5);
    ctx.font='bold 10px Russo One,sans-serif';ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillStyle=canP?'rgba(0,220,120,0.95)':'rgba(255,80,80,0.95)';
    ctx.fillText(`₩${b.cost.toLocaleString()}`,x+cols*TS/2,y+2);
  } else if(currentMode==='terrain'){
    ctx.fillStyle='rgba(255,165,0,0.25)';ctx.strokeStyle='rgba(255,165,0,0.8)';ctx.lineWidth=1.5;
    ctx.fillRect(x,y,TS,TS);ctx.strokeRect(x+0.75,y+0.75,TS-1.5,TS-1.5);
  } else {
    ctx.fillStyle='rgba(100,100,100,0.22)';ctx.strokeStyle='rgba(100,100,100,0.7)';ctx.lineWidth=1;
    ctx.fillRect(x,y,TS,TS);ctx.strokeRect(x+0.75,y+0.75,TS-1.5,TS-1.5);
  }
}

function drawScene(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const drawn=new Set();

  for(let r=0;r<GS;r++) for(let c=0;c<GS;c++){
    drawTerrain(r,c);
    const t=grid[r][c];
    if(t.type==='empty') continue;

    const b=BMAP[t.type];
    if(!b) continue;

    // Road types — draw every tile
    if(t.type==='road'||t.type==='highway'||t.type==='bridge'||t.type==='tunnel'||t.type==='roundabout'||t.type==='overpass'){
      drawRoadTile(r,c,t.type);
      continue;
    }

    // Buildings: draw full sprite at origin (spans all tiles)
    const okey=`${t.origin[0]},${t.origin[1]}`;
    if(drawn.has(okey)) continue;
    drawn.add(okey);
    const isActive=activeMap[okey]!==false;
    drawBuilding(t.origin[0],t.origin[1],b,isActive);
  }

  // Hover
  if(hoverCell) drawHover(hoverCell.r, hoverCell.c);
}

function updateCounts(){
  let blds=0,roads=0;
  const seen=new Set();
  for(let r=0;r<GS;r++) for(let c=0;c<GS;c++){
    const t=grid[r][c];
    if(t.type==='empty') continue;
    const okey=`${t.origin[0]},${t.origin[1]}`;
    if(seen.has(okey)) continue; seen.add(okey);
    if(t.type==='road'||t.type==='highway'||t.type==='bridge') roads++;
    else blds++;
  }
  document.getElementById('bldCnt').textContent=`건물: ${blds}개`;
  document.getElementById('rdCnt').textContent=`도로: ${roads}칸`;
}

    <div style="margin-bottom:2px">${b.catLabel} | ${b.size[1]}×${b.size[0]}</div>

  }

}

// EVENTS
// ══════════════════════════════════════════════════
const mapWrap=document.getElementById('mapWrap');

function getCellFromEvent(e){
  const rect=canvas.getBoundingClientRect();
  const x=e.clientX-rect.left, y=e.clientY-rect.top;
  const c=Math.floor(x/TS), r=Math.floor(y/TS);
  if(c<0||c>=GS||r<0||r>=GS) return null;
  return {r,c};
}

function handleAction(r,c,isRight=false){
  if(isRight||currentMode==='erase'){
    eraseTile(r,c); refresh(); autosave(); return;
  }
  if(currentMode==='terrain'){
    terrain[r][c]=currentTerrainTool; drawScene(); autosave(); return;
  }
  if(currentMode==='build'){
    const b=BMAP[currentTool];
    if(!b) return;
    let ok=false;
    if(currentTool==='road'||currentTool==='highway'||currentTool==='bridge'||currentTool==='tunnel'||currentTool==='roundabout'||currentTool==='overpass'){
      ok=placeRoad(r,c);
    } else {
      ok=placeBuilding(r,c,currentTool);
    }
    if(ok){ refresh(); autosave(); }
    else if(budget<(b?.cost||0)){
      const bv=document.getElementById('budgetVal');
      bv.style.color='var(--red)';
      setTimeout(()=>bv.style.color='var(--yellow)',600);
    }
  }
}

canvas.addEventListener('mousedown',e=>{
  if(e.button!==0&&e.button!==2) return;
  isDragging=true;
  const cell=getCellFromEvent(e);
  if(cell) handleAction(cell.r,cell.c,e.button===2);
});
canvas.addEventListener('mousemove',e=>{
  const cell=getCellFromEvent(e);
  hoverCell=cell;
  if(cell){
    document.getElementById('coordD').textContent=`좌표: (${cell.c+1},${cell.r+1})`;
    updateTileInfo(cell.r,cell.c);
    if(isDragging&&currentMode!=='build') handleAction(cell.r,cell.c,e.buttons===2);
  }
  drawScene();
});
canvas.addEventListener('mouseup',()=>isDragging=false);
canvas.addEventListener('mouseleave',()=>{hoverCell=null;isDragging=false;drawScene();});
canvas.addEventListener('contextmenu',e=>e.preventDefault());

const TAX_INTERVAL = 10; // seconds
let taxCountdown = TAX_INTERVAL;

function collectTax(){
  const raw=calcRaw();
  const {am}=buildActiveMaps(raw);
  const stats=calcFinal(am);
  const tax=calcTaxIncome(stats);
  budget+=tax;
  // Flash budget green
  const bv=document.getElementById('budgetVal');
  bv.style.color='var(--green)';
  setTimeout(()=>bv.style.color='var(--yellow)',1200);
  // Toast
  const toast=document.getElementById('taxToast');
  toast.textContent=`💰 세금 징수 +₩${tax.toLocaleString()}`;
  toast.style.opacity='1'; toast.style.transform='translateY(0)';
  setTimeout(()=>{toast.style.opacity='0';toast.style.transform='translateY(-12px)';},2200);
  updateBudgetMoneyBuildings(stats);
  refresh();
  taxCountdown=TAX_INTERVAL;
}

// Countdown ticker every second
setInterval(()=>{
  taxCountdown--;
  const el=document.getElementById('taxInfo');
  if(el){
    const raw2=calcRaw();const {am:am2}=buildActiveMaps(raw2);const st2=calcFinal(am2);
    const tax2=calcTaxIncome(st2);
    el.textContent=`+₩${tax2.toLocaleString()} (${taxCountdown}초)`;
  }
  if(taxCountdown<=0) collectTax();
},1000);

// ══════════════════════════════════════════════════
// AUTOSAVE / AUTOLOAD (localStorage)
// ══════════════════════════════════════════════════
const LS_KEY = 'cityos_save_v5';

function autosave(){
  try{
    const data={version:5,name:cityName,terrain,grid,budget};
    localStorage.setItem(LS_KEY, JSON.stringify(data));
  }catch(e){console.warn('autosave failed',e);}
}

function autoload(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(!raw) return false;
    const d=JSON.parse(raw);
    if(d.version!==5) return false;
    cityName=d.name||'도시';
    terrain=d.terrain||newTerrainGrid('grass');
    grid=d.grid;
    budget=d.budget||STARTING_BUDGET;
    return true;
  }catch(e){return false;}
}

// Auto-save every 15s
setInterval(autosave, 15000);


function saveCity(){
  const n=prompt('도시 이름:',cityName)||cityName; cityName=n;
  const raw=calcRaw();const {am}=buildActiveMaps(raw);
  const data={version:4,name:cityName,terrain,grid,budget,stats:calcFinal(am)};
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${cityName}.json`;a.click();
}
function loadCity(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{try{
    const d=JSON.parse(ev.target.result);
    cityName=d.name||'도시';
    terrain=d.terrain||newTerrainGrid('grass');
    grid=d.grid;
    budget=d.budget||STARTING_BUDGET;
    refresh();
    alert(`"${cityName}" 불러오기 완료!`);
  }catch{alert('파일 오류');}};
  r.readAsText(f); e.target.value='';
}
function newCity(){
  if(confirm('새 도시를 시작할까요? 현재 진행이 삭제됩니다.')){
    terrain=newTerrainGrid('grass');
    initGrid();
    budget=STARTING_BUDGET;
    refresh();
  }
}

// ══════════════════════════════════════════════════
// REFRESH (main update)
// ══════════════════════════════════════════════════
function refresh(){
  const raw=calcRaw();
  const {am,rm}=buildActiveMaps(raw);
  activeMap=am; inactiveReasonMap=rm;
  const stats=calcFinal(am);
  updateStatsRow(stats);
  updateAlerts(getAlerts(stats));
  updateCityStats(stats);
  updateCounts();
  updateBudgetMoneyBuildings(stats);
  drawScene();
}

// ══════════════════════════════════════════════════
// KEYBOARD
// ══════════════════════════════════════════════════
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  const k=e.key.toLowerCase();
  if(k==='r') selTool('road','build');
  if(k==='e'||k==='escape') selTool('erase','erase');
  if(k==='t') toggleTheme();
});

// ══════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════
initGrid();
buildLeftPanel();
buildTerrainModal();

// Try to restore from autosave
if(autoload()){
  refresh();
  const toast=document.getElementById('taxToast');
  toast.textContent='💾 자동저장 데이터를 불러왔습니다';
  toast.style.color='var(--accent)';toast.style.borderColor='var(--accent)';
  toast.style.opacity='1';toast.style.transform='translateY(0)';
  setTimeout(()=>{toast.style.opacity='0';toast.style.transform='translateY(-12px)';
    setTimeout(()=>{toast.style.color='var(--green)';toast.style.borderColor='var(--green)';},800);
  },2500);
} else {
  refresh();
}
selTool('road','build');
</script>
